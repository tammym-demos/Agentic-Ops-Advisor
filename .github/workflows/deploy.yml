# =============================================================================
# Deploy — Azure AI Foundry Agent Service
# =============================================================================
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#
#   OIDC / Federated Identity (recommended):
#     AZURE_CLIENT_ID          — App Registration client ID
#     AZURE_TENANT_ID          — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID    — Target subscription ID
#
#   OR Service Principal secret (legacy):
#     AZURE_CREDENTIALS        — JSON output of `az ad sp create-for-rbac
#                                  --name "agentic-ops-advisor-deploy"
#                                  --role contributor
#                                  --scopes /subscriptions/<id>/resourceGroups/rg-agentic-ops-advisor
#                                  --sdk-auth`
#
#   Agent runtime config (stored as environment secrets in the "production"
#   GitHub Environment so they are gated by branch-protection review):
#     AZURE_AI_AGENTS_ENDPOINT             — Foundry Agent Service endpoint URL
#     AZURE_OPENAI_ENDPOINT                — Azure OpenAI endpoint URL
#     AZURE_OPENAI_DEPLOYMENT              — Model deployment name (e.g. gpt-4.1)
#     APPLICATIONINSIGHTS_CONNECTION_STRING — App Insights (optional)
#
# Required Azure RBAC roles for the service principal:
#
#   1. Contributor (management-plane) — scoped to the resource group:
#      Grants Bicep deployment, ACR operations, resource management.
#      NOTE: RG-scoped Contributor is sufficient for most deploy steps.
#      The Bicep step auto-falls-back to resource-group-scoped deployment.
#
#   1b. (Optional) Contributor at subscription scope:
#       Required for `az deployment sub create` (main.bicep creates the RG).
#       Without this, the deploy falls back to main-rg.bicep (RG-scoped).
#       Grant with:  ./scripts/grant-sp-permissions.sh
#
#   2. Azure AI Developer (data-plane) — scoped to the AI Hub resource:
#      Role ID: 64702f94-c441-49e6-a78b-ef80e0188fee
#      Grants data-plane access to Foundry Agent Service (create/list/update
#      agents, threads, runs). Without this role, agent deploy will fail with
#      PermissionDenied on Microsoft.CognitiveServices data actions.
#      The Hub is a CognitiveServices/accounts resource (hub-agentops-prod),
#      NOT a MachineLearningServices workspace.
#
#   One-time setup (run as Owner or User Access Administrator):
#     az role assignment create --assignee <SP_OBJECT_ID> \
#       --role "Azure AI Developer" \
#       --scope /subscriptions/<sub>/resourceGroups/rg-agentic-ops-advisor/providers/Microsoft.CognitiveServices/accounts/hub-agentops-prod
#
# OIDC setup (one-time, run locally):
#   az ad app create --display-name "agentic-ops-advisor-deploy"
#   az ad sp create --id <appId>
#   az role assignment create --assignee <appId> \
#       --role contributor \
#       --scope /subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/rg-agentic-ops-advisor
#   # Grant data-plane access to the AI hub (required for Foundry Agent Service APIs):
#   az role assignment create \
#       --assignee-object-id <spObjectId> \
#       --assignee-principal-type ServicePrincipal \
#       --role "Azure AI Developer" \
#       --scope /subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/rg-agentic-ops-advisor/providers/Microsoft.CognitiveServices/accounts/hub-agentops-prod
#   # Add federated credential for this repo + branch:
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "agentic-ops-main",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:tammym-demos/Agentic-Ops-Advisor:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
# =============================================================================

name: Deploy — Foundry Agent Service

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_infra:
                description: "Force Bicep infra re-deploy even without infra/ changes"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

# Prevent concurrent deployments to the same environment.
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write   # Required for OIDC login
    deployments: write

jobs:
    # -------------------------------------------------------------------------
    # 1. Detect whether infra/ files changed (used to gate Bicep step)
    # -------------------------------------------------------------------------
    detect-changes:
        name: Detect changed paths
        runs-on: ubuntu-latest
        outputs:
            infra_changed: ${{ steps.filter.outputs.infra }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 2  # need previous commit to diff against

            - name: Detect infra/ changes
              id: filter
              run: |
                  if git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
                      echo "infra=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "infra=false" >> "$GITHUB_OUTPUT"
                  fi

    # -------------------------------------------------------------------------
    # 2. Deploy infrastructure + agent
    # -------------------------------------------------------------------------
    deploy:
        name: Deploy to production
        needs: detect-changes
        runs-on: ubuntu-latest
        environment: production   # GitHub Environment with protection rules

        env:
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            AZURE_RESOURCE_GROUP: rg-agentic-ops-advisor
            AZURE_LOCATION: eastus
            AZURE_AI_AGENTS_ENDPOINT: ${{ secrets.AZURE_AI_AGENTS_ENDPOINT }}
            AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "false"
            ENABLE_WORK_IQ: "true"
            ENABLE_MCP: "false"
            DB_MODE: sqlite

        steps:
            # ------------------------------------------------------------------
            # Step 1 — Checkout
            # ------------------------------------------------------------------
            - name: Checkout code
              uses: actions/checkout@v5

            # ------------------------------------------------------------------
            # Step 2 — Azure login (OIDC preferred; falls back to SP secret)
            # ------------------------------------------------------------------
            - name: Azure login (OIDC)
              if: ${{ env.AZURE_CLIENT_ID != '' }}
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            - name: Azure login (service principal secret fallback)
              if: ${{ env.AZURE_CLIENT_ID == '' }}
              uses: azure/login@v3
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            # ------------------------------------------------------------------
            # Step 3 — Set up Python
            # ------------------------------------------------------------------
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            # pyodbc (in requirements.txt) requires unixodbc-dev/msodbcsql18 to build,
            # even when DB_MODE=sqlite is used at runtime.
            - name: Install ODBC Driver for SQL Server
              run: |
                  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
                  curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                  sudo apt-get update
                  sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            # ------------------------------------------------------------------
            # Step 3b — Pre-deploy tests (gate: untested code never deploys)
            # ------------------------------------------------------------------
            - name: Set up local SQLite DB
              run: python scripts/setup_local_db.py

            - name: Run tests
              run: |
                  pip install pytest pytest-asyncio
                  python -m pytest tests/ -x --tb=short

            # ------------------------------------------------------------------
            # Step 3c — Validate Bicep templates (always runs, catches syntax
            # errors early — local build only, no Azure auth required)
            # ------------------------------------------------------------------
            - name: Validate Bicep templates
              run: |
                  az bicep build --file infra/main.bicep --stdout > /dev/null
                  az bicep build --file infra/main-rg.bicep --stdout > /dev/null
                  echo "✅ Bicep template validation passed (main.bicep + main-rg.bicep)"

            # ------------------------------------------------------------------
            # Step 4 — Deploy Bicep infrastructure (conditional)
            #
            # Strategy: main.bicep is subscription-scoped and requires the SP
            # to have Contributor at subscription level. If the SP only has
            # RG-scoped Contributor (the common case), the sub-level deploy
            # fails with AuthorizationFailed.
            #
            # Fallback: ensure the RG exists via `az group create`, then run
            # `az deployment group create` with infra/main-rg.bicep (the
            # resource-group-scoped variant that deploys the same modules).
            #
            # To avoid the fallback, grant subscription Contributor:
            #   ./scripts/grant-sp-permissions.sh
            # ------------------------------------------------------------------
            - name: Deploy Bicep infrastructure
              if: >-
                  needs.detect-changes.outputs.infra_changed == 'true' ||
                  github.event.inputs.force_infra == 'true'
              run: |
                  echo "::group::Bicep deployment"

                  DEPLOY_NAME="agentic-ops-advisor-$(date -u +%Y%m%d%H%M%S)"
                  RG_NAME="$AZURE_RESOURCE_GROUP"

                  # --- Attempt 1: subscription-scoped deploy (requires sub Contributor) ---
                  echo "🔍 Attempting subscription-scoped deployment..."
                  if az deployment sub create \
                      --name "$DEPLOY_NAME" \
                      --location "$AZURE_LOCATION" \
                      --template-file infra/main.bicep \
                      --parameters @infra/parameters.json \
                      --output table 2>&1; then
                      echo "✅ Subscription-scoped Bicep deployment succeeded."
                  else
                      echo ""
                      echo "⚠️  Subscription-scoped deploy failed (likely AuthorizationFailed)."
                      echo "   The SP needs Contributor at subscription scope for 'az deployment sub create'."
                      echo "   To fix permanently, run:  ./scripts/grant-sp-permissions.sh"
                      echo ""
                      echo "🔄 Falling back to resource-group-scoped deployment..."

                      # Ensure the RG exists (check first to avoid location-mismatch errors)
                      if az group show --name "$RG_NAME" --output none 2>/dev/null; then
                          echo "✅ Resource group '$RG_NAME' already exists."
                      else
                          echo "Creating resource group '$RG_NAME'..."
                          az group create \
                              --name "$RG_NAME" \
                              --location "$AZURE_LOCATION" \
                              --tags project=agentic-ops-advisor environment=prod managedBy=bicep \
                              --output none 2>&1 || {
                              echo "❌ Cannot create resource group '$RG_NAME'."
                              echo "   The SP may not have sufficient permissions even at RG scope."
                              echo "   Grant subscription Contributor:  ./scripts/grant-sp-permissions.sh"
                              exit 1
                          }
                      fi

                      # Deploy using the RG-scoped template (same modules, no RG resource)
                      az deployment group create \
                          --name "$DEPLOY_NAME" \
                          --resource-group "$RG_NAME" \
                          --template-file infra/main-rg.bicep \
                          --parameters @infra/parameters.json \
                          --output table

                      echo "✅ Resource-group-scoped Bicep deployment succeeded (fallback)."
                  fi

                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 4b — Ensure Azure AI Developer role on the AI hub
            # (data-plane access required by Foundry Agent Service APIs)
            # ------------------------------------------------------------------
            - name: Ensure Azure AI Developer role on AI hub
              run: |
                  PARAMS_FILE="infra/parameters.json"
                  PROJECT_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['projectName']['value'])" 2>/dev/null || echo "agentops")
                  ENV_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['environmentName']['value'])" 2>/dev/null || echo "prod")
                  RG_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['resourceGroupName']['value'])" 2>/dev/null || echo "rg-agentic-ops-advisor")
                  HUB_NAME="hub-${PROJECT_NAME}-${ENV_NAME}"
                  # Use the authenticated subscription ID from az CLI to avoid leading/trailing
                  # whitespace in the AZURE_SUBSCRIPTION_ID secret causing scope lookup errors.
                  SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                  HUB_SCOPE="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.CognitiveServices/accounts/${HUB_NAME}"

                  # Resolve the object ID of the currently authenticated principal
                  ACCOUNT_TYPE=$(az account show --query user.type -o tsv 2>/dev/null || echo "user")
                  if [[ "${ACCOUNT_TYPE}" == "servicePrincipal" ]]; then
                      SP_NAME=$(az account show --query user.name -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_ID=$(az ad sp show --id "${SP_NAME}" --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="ServicePrincipal"
                  else
                      PRINCIPAL_ID=$(az ad signed-in-user show --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="User"
                  fi

                  if [[ -z "${PRINCIPAL_ID}" ]]; then
                      echo "⚠️  Could not determine principal object ID — skipping Azure AI Developer role assignment."
                      exit 0
                  fi

                  echo "Principal: ${PRINCIPAL_ID} (${PRINCIPAL_TYPE})"
                  echo "Hub scope: ${HUB_SCOPE}"

                  # Idempotent: only assign if not already present
                  ROLE_EXISTS=$(az role assignment list \
                      --assignee "${PRINCIPAL_ID}" \
                      --role "Azure AI Developer" \
                      --scope "${HUB_SCOPE}" \
                      --query "[].id" -o tsv 2>/dev/null || echo "")

                  if [[ -z "${ROLE_EXISTS}" ]]; then
                      echo "Assigning Azure AI Developer role to ${PRINCIPAL_ID}..."
                      az role assignment create \
                          --assignee-object-id "${PRINCIPAL_ID}" \
                          --assignee-principal-type "${PRINCIPAL_TYPE}" \
                          --role "Azure AI Developer" \
                          --scope "${HUB_SCOPE}" \
                          --output none
                      echo "✅ Azure AI Developer role assigned on ${HUB_NAME}."
                  else
                      echo "✅ Azure AI Developer role already present on ${HUB_NAME}."
                  fi

            # ------------------------------------------------------------------
            # Step 5a — Resolve ACR login server
            # ------------------------------------------------------------------
            - name: Resolve ACR login server
              run: |
                  # Try Bicep outputs first; fall back to convention-based name
                  ACR_NAME=$(az deployment sub show \
                      --name "$(az deployment sub list --location "$AZURE_LOCATION" \
                          --query "[?starts_with(name,'agentic-ops-advisor')].name | [0]" -o tsv 2>/dev/null || echo '')" \
                      --query "properties.outputs.acrName.value" -o tsv 2>/dev/null || echo '')

                  if [ -z "$ACR_NAME" ]; then
                      # Convention: cr<hubName> with hyphens stripped
                      ACR_NAME="crhubagentopsprod"
                      echo "⚠️  Could not resolve ACR from Bicep outputs — using convention: $ACR_NAME"
                  fi

                  ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv 2>/dev/null || echo "${ACR_NAME}.azurecr.io")
                  echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
                  echo "ACR_NAME=${ACR_NAME}" >> "$GITHUB_ENV"
                  echo "✅ ACR: ${ACR_LOGIN_SERVER}"

            # ------------------------------------------------------------------
            # Step 5b — Build and push container image to ACR
            # ------------------------------------------------------------------
            - name: Build and push container image
              run: |
                  echo "::group::Container build & push"
                  IMAGE_TAG="${{ github.sha }}"
                  IMAGE_NAME="${ACR_LOGIN_SERVER}/agentic-ops-advisor"

                  # Authenticate to ACR
                  az acr login --name "$ACR_NAME"

                  # Build the container image
                  docker build \
                      --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
                      --tag "${IMAGE_NAME}:latest" \
                      --label "org.opencontainers.image.revision=${{ github.sha }}" \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      .

                  # Push both tags
                  docker push "${IMAGE_NAME}:${IMAGE_TAG}"
                  docker push "${IMAGE_NAME}:latest"

                  echo "CONTAINER_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"
                  echo "✅ Pushed: ${IMAGE_NAME}:${IMAGE_TAG}"
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5c — Diagnose model deployments on AI Hub
            # ------------------------------------------------------------------
            # WHY: The agent creation fails with "invalid_engine_error: Failed to
            # resolve model info" when AZURE_OPENAI_DEPLOYMENT doesn't match a
            # deployment accessible from the project endpoint. This step lists
            # available deployments on the Hub to debug mismatches.
            - name: Diagnose model deployments on AI Hub
              continue-on-error: true
              run: |
                  echo "::group::Model deployment diagnostics"

                  AI_HUB_NAME="hub-agentops-prod"
                  
                  # List all deployments on the Hub
                  echo "📋 Model deployments on $AI_HUB_NAME:"
                  DEPLOYMENTS=$(az cognitiveservices account deployment list \
                      --name "$AI_HUB_NAME" \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --query "[].{Name:name, Model:properties.model.name, Capacity:sku.capacity}" \
                      -o table 2>&1 || echo "")
                  
                  if [ -n "$DEPLOYMENTS" ]; then
                      echo "$DEPLOYMENTS"
                  else
                      echo "⚠️  Could not list deployments (Hub may not exist or API error)"
                  fi
                  
                  # Validate AZURE_OPENAI_DEPLOYMENT matches one of them
                  DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}"
                  DEPLOYMENT_NAMES=$(az cognitiveservices account deployment list \
                      --name "$AI_HUB_NAME" \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --query "[].name" -o tsv 2>/dev/null || echo "")
                  
                  echo ""
                  echo "🔍 Checking AZURE_OPENAI_DEPLOYMENT secret..."
                  if [ -z "$DEPLOYMENT_NAME" ]; then
                      echo "❌ AZURE_OPENAI_DEPLOYMENT is not set!"
                  else
                      # Show deployment name length for debugging (masked in logs)
                      echo "AZURE_OPENAI_DEPLOYMENT is set (length: ${#DEPLOYMENT_NAME} chars)"
                      
                      if echo "$DEPLOYMENT_NAMES" | grep -qx "$DEPLOYMENT_NAME"; then
                          echo "✅ Deployment '$DEPLOYMENT_NAME' found on Hub"
                      else
                          echo "❌ Deployment '$DEPLOYMENT_NAME' NOT found on Hub!"
                          echo "Available deployments: $DEPLOYMENT_NAMES"
                          echo ""
                          echo "🔧 Fix: Update AZURE_OPENAI_DEPLOYMENT secret to match one of the deployment names above"
                      fi
                  fi
                  
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5d — Ensure data-plane RBAC on AI Hub
            # ------------------------------------------------------------------
            # WHY: The deploy SP has Contributor (management-plane) but needs
            # Azure AI Developer (data-plane) to call Foundry Agent APIs like
            # list_agents / create_agent. The Hub is a CognitiveServices/accounts
            # resource created manually — not managed by Bicep — so we assign
            # the role imperatively here.
            #
            # Role: Azure AI Developer (64702f94-c441-49e6-a78b-ef80e0188fee)
            # Scope: Microsoft.CognitiveServices/accounts/hub-agentops-prod
            #
            # This step is best-effort: the SP (Contributor) usually cannot
            # self-assign roles (needs Owner or User Access Administrator).
            # If it fails, we log a warning and continue — an admin must
            # pre-assign the role using the one-liner in the header comments.
            - name: Ensure data-plane RBAC on AI Hub
              continue-on-error: true
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              run: |
                  echo "::group::Data-plane RBAC check"

                  # --- Config (derived from parameters.json, matching Step 4b) ---
                  PARAMS_FILE="infra/parameters.json"
                  PROJECT_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['projectName']['value'])" 2>/dev/null || echo "agentops")
                  ENV_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['environmentName']['value'])" 2>/dev/null || echo "prod")
                  AI_HUB_NAME="hub-${PROJECT_NAME}-${ENV_NAME}"
                  AI_DEVELOPER_ROLE_ID="64702f94-c441-49e6-a78b-ef80e0188fee"
                  MANAGED_IDENTITY_NAME="id-${PROJECT_NAME}-${ENV_NAME}"

                  # Resolve the AI Hub resource ID
                  HUB_RESOURCE_ID=$(az cognitiveservices account show \
                      --name "$AI_HUB_NAME" \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --query id -o tsv 2>/dev/null || echo "")

                  if [ -z "$HUB_RESOURCE_ID" ]; then
                      echo "⚠️  Could not find AI Hub '$AI_HUB_NAME' in $AZURE_RESOURCE_GROUP — skipping RBAC."
                      echo "::endgroup::"
                      exit 0
                  fi
                  echo "✅ AI Hub: $HUB_RESOURCE_ID"

                  # --- 1. Grant Azure AI Developer to the deploy SP ---
                  if [ -n "${AZURE_CLIENT_ID:-}" ]; then
                      SP_OBJECT_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || echo "")
                      if [ -n "$SP_OBJECT_ID" ]; then
                          echo "Assigning Azure AI Developer to SP $SP_OBJECT_ID on Hub..."
                          az role assignment create \
                              --assignee-object-id "$SP_OBJECT_ID" \
                              --assignee-principal-type ServicePrincipal \
                              --role "$AI_DEVELOPER_ROLE_ID" \
                              --scope "$HUB_RESOURCE_ID" \
                              --output none 2>&1 || echo "⚠️  Could not assign role (SP likely lacks Microsoft.Authorization/roleAssignments/write). An admin must pre-assign Azure AI Developer — see workflow header comments."
                          echo "✅ Azure AI Developer role assignment attempted for deploy SP."
                      else
                          echo "⚠️  Could not resolve SP object ID from AZURE_CLIENT_ID — skipping SP RBAC."
                      fi
                  fi

                  # --- 2. Grant Azure AI Developer to the managed identity ---
                  # The managed identity (id-agentops-prod) is used at runtime by
                  # the container agent and also needs data-plane access to the Hub.
                  MI_PRINCIPAL_ID=$(az identity show \
                      --name "$MANAGED_IDENTITY_NAME" \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --query principalId -o tsv 2>/dev/null || echo "")

                  if [ -n "$MI_PRINCIPAL_ID" ]; then
                      echo "Assigning Azure AI Developer to managed identity $MI_PRINCIPAL_ID on Hub..."
                      az role assignment create \
                          --assignee-object-id "$MI_PRINCIPAL_ID" \
                          --assignee-principal-type ServicePrincipal \
                          --role "$AI_DEVELOPER_ROLE_ID" \
                          --scope "$HUB_RESOURCE_ID" \
                          --output none 2>&1 || echo "⚠️  Could not assign MI role — admin must pre-assign."
                      echo "✅ Azure AI Developer role assignment attempted for managed identity."
                  else
                      echo "⚠️  Could not find managed identity '$MANAGED_IDENTITY_NAME' — skipping MI RBAC."
                  fi

                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5d.1 — Ensure capability host exists
            # ------------------------------------------------------------------
            - name: Ensure capability host exists
              run: |
                  echo "::group::Capability host setup"
                  # Create capability host with public hosting enabled (idempotent PUT)
                  HUB_RESOURCE_ID=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
                    --resource-type "Microsoft.CognitiveServices/accounts" \
                    --query "[?kind=='AIServices'].id" -o tsv | head -1)
                  
                  if [ -z "$HUB_RESOURCE_ID" ]; then
                    echo "⚠️  No AI Hub found — skipping capability host setup"
                  else
                    echo "Setting up capability host on: $HUB_RESOURCE_ID"
                    az rest --method PUT \
                      --url "${HUB_RESOURCE_ID}/capabilityHosts/accountcaphost?api-version=2025-10-01-preview" \
                      --body '{"properties": {"enablePublicHostingEnvironment": true}}' \
                      || echo "⚠️  Capability host setup returned non-zero (may already exist)"
                  fi
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5d.2 — Grant ACR pull to project identity
            # ------------------------------------------------------------------
            - name: Grant ACR pull to project identity
              run: |
                  echo "::group::ACR pull permissions"
                  # Get project managed identity
                  PROJECT_MI=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
                    --resource-type "Microsoft.CognitiveServices/accounts/projects" \
                    --query "[0].identity.principalId" -o tsv 2>/dev/null)
                  
                  ACR_ID=$(az acr show --name "${ACR_NAME}" --query id -o tsv 2>/dev/null)
                  
                  if [ -n "$PROJECT_MI" ] && [ -n "$ACR_ID" ]; then
                    az role assignment create \
                      --assignee-object-id "$PROJECT_MI" \
                      --assignee-principal-type ServicePrincipal \
                      --role "AcrPull" \
                      --scope "$ACR_ID" 2>/dev/null \
                      || echo "ℹ️  ACR pull role already assigned or insufficient permissions"
                    echo "✅ ACR pull permissions configured"
                  else
                    echo "⚠️  Could not determine project MI or ACR ID — skipping"
                  fi
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5e — Deploy hosted agent to Foundry Agent Service
            # ------------------------------------------------------------------
            - name: Deploy hosted agent to Foundry Agent Service
              run: |
                  echo "::group::Agent deployment"
                  python - <<'EOF'
                  import os, sys, time
                  sys.path.insert(0, os.getcwd())
                  from azure.ai.projects import AIProjectClient
                  from azure.ai.projects.models import HostedAgentDefinition
                  from azure.identity import DefaultAzureCredential

                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "")
                  if not endpoint:
                      print("⚠️  AZURE_AI_AGENTS_ENDPOINT not configured — skipping agent deploy.")
                      sys.exit(0)

                  deployment_name = os.environ.get("AZURE_OPENAI_DEPLOYMENT", "gpt-4.1")
                  container_image = os.environ.get("CONTAINER_IMAGE", "")
                  
                  if not container_image:
                      print("⚠️  CONTAINER_IMAGE not set — cannot deploy hosted agent.")
                      sys.exit(1)
                  
                  print(f"🔧 Configuration:")
                  print(f"   Endpoint: {endpoint}")
                  print(f"   Model deployment: {deployment_name}")
                  print(f"   Container image: {container_image}")

                  client = AIProjectClient(
                      endpoint=endpoint,
                      credential=DefaultAzureCredential(),
                  )

                  # Read system prompt from file
                  prompt_path = "agent/system_prompt.md"
                  system_prompt = open(prompt_path).read() if os.path.exists(prompt_path) else (
                      "You are the Agentic Ops Advisor — a governed AI agent for "
                      "root-cause and change-context reasoning over infrastructure telemetry."
                  )

                  # Build tool schemas for the hosted agent definition
                  # The hosted agent container handles tool dispatch, but the platform
                  # needs the schemas to pass to the LLM for function calling.
                  from agent.agent import _build_function_set
                  enable_work_iq = os.environ.get("ENABLE_WORK_IQ", "true").lower() not in ("false", "0", "no")
                  function_set = _build_function_set(enable_work_iq)
                  
                  # Convert function set to tool definitions format expected by hosted agent
                  tools = [{"type": "function", "function": f} for f in function_set]

                  # Create hosted agent definition with container image reference
                  agent_definition = HostedAgentDefinition(
                      model=deployment_name,
                      instructions=system_prompt,
                      tools=tools,
                      container={
                          "image": container_image,
                          "port": 8088,
                      },
                  )

                  agent_name = "agentic-ops-advisor"
                  agent_description = "Agentic Ops Advisor — hosted agent for infrastructure telemetry & change-context reasoning"

                  # Retry with backoff to handle RBAC propagation delays
                  MAX_RETRIES = 5
                  agent_version = None
                  for attempt in range(MAX_RETRIES):
                      try:
                          print(f"Creating/updating hosted agent version (attempt {attempt + 1}/{MAX_RETRIES})...")
                          agent_version = client.agents.create_version(
                              agent_name=agent_name,
                              definition=agent_definition,
                              description=agent_description,
                              metadata={"container_image": container_image, "deployment_type": "hosted"},
                          )
                          print(f"✅ Hosted agent version created: {agent_version.name}/{agent_version.version}")
                          break
                      except Exception as e:
                          if "PermissionDenied" in str(e) and attempt < MAX_RETRIES - 1:
                              wait = 30 * (attempt + 1)
                              print(f"⏳ RBAC not propagated yet (attempt {attempt + 1}/{MAX_RETRIES}), waiting {wait}s...")
                              time.sleep(wait)
                          elif attempt < MAX_RETRIES - 1:
                              # For other transient errors, retry with shorter backoff
                              wait = 10 * (attempt + 1)
                              print(f"⚠️  Agent creation failed (attempt {attempt + 1}/{MAX_RETRIES}): {e}")
                              print(f"   Retrying in {wait}s...")
                              time.sleep(wait)
                          else:
                              error_msg = str(e)
                              print(f"❌ Failed to create hosted agent: {error_msg}")
                              print("\n🔍 Troubleshooting:")
                              print("   1. Verify AZURE_AI_AGENTS_ENDPOINT is correct")
                              print("   2. Check that the SP has 'Azure AI Developer' role on the Hub")
                              print("   3. Ensure capability host is configured (previous step)")
                              print("   4. Verify ACR pull permissions (previous step)")
                              if "invalid_engine_error" in error_msg or "Failed to resolve model info" in error_msg:
                                  print(f"\n   Model resolution failure:")
                                  print(f"   Requested model: {deployment_name}")
                                  print("   Check the 'Diagnose model deployments' step for available deployments")
                              sys.exit(1)

                  if not agent_version:
                      print("❌ Failed to create agent version after all retries")
                      sys.exit(1)

                  # Persist agent name and version for subsequent steps
                  agent_id = f"{agent_version.name}/{agent_version.version}"
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"DEPLOYED_AGENT_ID={agent_id}\n")
                  
                  print(f"\n✅ Hosted agent deployed successfully: {agent_id}")
                  EOF
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5f — Seed local SQLite DB (required for smoke-test tool calls)
            # ------------------------------------------------------------------
            - name: Set up local SQLite DB for smoke test
              run: python scripts/setup_local_db.py

            # ------------------------------------------------------------------
            # Step 6 — Smoke test: send one query, verify response
            # ------------------------------------------------------------------
            # NOTE: This step is non-fatal (continue-on-error: true). The agent
            # deployment itself (steps 1-5e) is independent of the smoke test.
            # If the smoke test fails, the deployment is still considered successful
            # and the issue should be investigated separately.
            
            # Step 6a — Smoke test: Prompt agent pattern (legacy)
            # Validates that the agent can still be invoked via the prompt agent API
            # with client-side tool dispatch for backward compatibility.
            - name: Smoke test (prompt agent pattern)
              id: smoke_test_prompt
              continue-on-error: true
              run: |
                  echo "::group::Smoke test — prompt agent pattern"
                  python - <<'EOF'
                  import os, sys
                  sys.path.insert(0, os.getcwd())

                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "")
                  agent_id = os.environ.get("DEPLOYED_AGENT_ID", "")

                  if not endpoint or not agent_id:
                      print("⚠️  Smoke test skipped — agent not deployed (endpoint or agent ID missing).")
                      sys.exit(0)

                  from azure.ai.agents import AgentsClient
                  from azure.ai.agents.models import MessageRole
                  from azure.identity import DefaultAzureCredential
                  from agent.agent import _build_function_set

                  client = AgentsClient(
                      endpoint=endpoint,
                      credential=DefaultAzureCredential(),
                  )

                  # Register function implementations so create_and_process can dispatch
                  # tool calls automatically during the run. enable_auto_function_calls
                  # sets client.runs._function_tool, which create_and_process uses for
                  # dispatching — passing toolset only to create_and_process is NOT enough.
                  enable_work_iq = os.environ.get("ENABLE_WORK_IQ", "true").lower() not in ("false", "0", "no")
                  function_set = _build_function_set(enable_work_iq)
                  client.enable_auto_function_calls(tools=function_set)

                  probe = "What is the GPU utilization trend for the last 24 hours?"
                  print(f"Probe query: {probe}")

                  thread = client.threads.create()
                  client.messages.create(
                      thread_id=thread.id,
                      role="user",
                      content=probe,
                  )

                  run = client.runs.create_and_process(
                      thread_id=thread.id,
                      agent_id=agent_id,
                  )

                  if run.status != "completed":
                      error_detail = getattr(run, "last_error", None)
                      error_msg = f"run status: {run.status}"
                      if error_detail:
                          error_msg += f" — {error_detail}"
                      print(f"❌ Smoke test FAILED — {error_msg}")
                      sys.exit(1)

                  response_text = client.messages.get_last_message_text_by_role(
                      thread_id=thread.id,
                      role=MessageRole.AGENT,
                  )
                  if not response_text:
                      print("❌ Smoke test FAILED — no agent response received.")
                      sys.exit(1)

                  # Robust response text extraction (handle different SDK return types)
                  try:
                      if hasattr(response_text, 'text'):
                          if hasattr(response_text.text, 'value'):
                              preview = response_text.text.value[:300]
                          else:
                              preview = str(response_text.text)[:300]
                      else:
                          preview = str(response_text)[:300]
                  except Exception as e:
                      print(f"⚠️  Could not extract response preview: {e}")
                      preview = "[response received but preview extraction failed]"

                  print(f"✅ Smoke test PASSED (prompt agent)\nResponse preview: {preview}")
                  EOF
                  echo "::endgroup::"
            
            # Step 6b — Smoke test: Hosted agent pattern (Foundry Responses API)
            # Validates that the container is running and responding to HTTP requests
            # via the /responses endpoint with server-side tool dispatch.
            - name: Smoke test (hosted agent pattern)
              id: smoke_test_hosted
              continue-on-error: true
              run: |
                  echo "::group::Smoke test — hosted agent pattern (Foundry Responses API)"
                  python - <<'EOF'
                  import os, sys, json
                  sys.path.insert(0, os.getcwd())

                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "")
                  agent_id = os.environ.get("DEPLOYED_AGENT_ID", "")

                  if not endpoint or not agent_id:
                      print("⚠️  Smoke test skipped — agent not deployed (endpoint or agent ID missing).")
                      sys.exit(0)

                  from azure.identity import DefaultAzureCredential
                  import requests

                  # Get Azure access token for authentication
                  credential = DefaultAzureCredential()
                  token = credential.get_token("https://cognitiveservices.azure.com/.default")
                  
                  # The hosted agent is accessible via the Foundry endpoint
                  # Pattern: {endpoint}/agents/{agent_name}/responses
                  # NOTE: We use agent name "agentic-ops-advisor" not agent_id
                  responses_url = f"{endpoint.rstrip('/')}/agents/agentic-ops-advisor/responses"
                  
                  probe = "What is the GPU utilization trend for the last 24 hours?"
                  print(f"Probe query: {probe}")
                  print(f"Endpoint: {responses_url}")
                  
                  try:
                      response = requests.post(
                          responses_url,
                          json={"input": probe, "stream": False},
                          headers={
                              "Authorization": f"Bearer {token.token}",
                              "Content-Type": "application/json",
                          },
                          timeout=180,  # Hosted agents may take time to cold-start + run tool loops
                      )
                      
                      response.raise_for_status()
                      data = response.json()
                      
                      # Validate Foundry Responses API format
                      if not isinstance(data, dict):
                          print(f"❌ Smoke test FAILED — invalid response format (expected dict, got {type(data).__name__})")
                          sys.exit(1)
                      
                      if "status" not in data or "output" not in data:
                          print(f"❌ Smoke test FAILED — missing required fields (status/output)")
                          sys.exit(1)
                      
                      if data.get("status") != "completed":
                          print(f"❌ Smoke test FAILED — status: {data.get('status')}")
                          if "error" in data:
                              print(f"   Error: {data['error']}")
                          sys.exit(1)
                      
                      # Extract assistant message from output
                      output_messages = data.get("output", [])
                      assistant_msg = next((m for m in output_messages if m.get("role") == "assistant"), None)
                      
                      if not assistant_msg or not assistant_msg.get("content"):
                          print("❌ Smoke test FAILED — no assistant response in output.")
                          sys.exit(1)
                      
                      preview = str(assistant_msg["content"])[:300]
                      print(f"✅ Smoke test PASSED (hosted agent)\nResponse preview: {preview}")
                  
                  except requests.exceptions.RequestException as e:
                      print(f"❌ Smoke test FAILED — HTTP request error: {e}")
                      if hasattr(e, 'response') and e.response is not None:
                          print(f"   Status: {e.response.status_code}")
                          print(f"   Body: {e.response.text[:500]}")
                      sys.exit(1)
                  except Exception as e:
                      print(f"❌ Smoke test FAILED — unexpected error: {e}")
                      import traceback
                      traceback.print_exc()
                      sys.exit(1)
                  EOF
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 7 — Post deployment status summary
            # ------------------------------------------------------------------
            - name: Post deployment status
              if: always()
              run: |
                  STATUS="${{ job.status }}"
                  SHA="${{ github.sha }}"
                  REF="${{ github.ref_name }}"
                  ACTOR="${{ github.actor }}"
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  AGENT_ID="${DEPLOYED_AGENT_ID:-not deployed}"
                  CONTAINER="${CONTAINER_IMAGE:-not built}"
                  SMOKE_TEST_PROMPT="${{ steps.smoke_test_prompt.outcome }}"
                  SMOKE_TEST_HOSTED="${{ steps.smoke_test_hosted.outcome }}"

                  echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Field        | Value |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|--------------|-------|" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Status**   | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Commit**   | \`${SHA:0:8}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Branch**   | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Actor**    | ${ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Agent ID** | \`${AGENT_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Container** | \`${CONTAINER}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Time**     | ${TIMESTAMP} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"

                  # Deployment status (steps 1-5e)
                  if [ "$AGENT_ID" != "not deployed" ]; then
                      echo "✅ **Agent deployment succeeded.** The agent is live on Azure AI Foundry Agent Service." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "❌ **Agent deployment failed.** Check the 'Deploy container agent' step for details." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  
                  # Smoke test status (non-fatal)
                  echo "### Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  
                  # Prompt agent pattern test
                  if [ "$SMOKE_TEST_PROMPT" = "success" ]; then
                      echo "- ✅ **Prompt agent pattern:** Passed" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST_PROMPT" = "failure" ]; then
                      echo "- ⚠️  **Prompt agent pattern:** Failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST_PROMPT" = "skipped" ]; then
                      echo "- ℹ️  **Prompt agent pattern:** Skipped" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "- ❓ **Prompt agent pattern:** Unknown" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  
                  # Hosted agent pattern test
                  if [ "$SMOKE_TEST_HOSTED" = "success" ]; then
                      echo "- ✅ **Hosted agent pattern (Responses API):** Passed" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST_HOSTED" = "failure" ]; then
                      echo "- ⚠️  **Hosted agent pattern (Responses API):** Failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST_HOSTED" = "skipped" ]; then
                      echo "- ℹ️  **Hosted agent pattern (Responses API):** Skipped" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "- ❓ **Hosted agent pattern (Responses API):** Unknown" >> "$GITHUB_STEP_SUMMARY"
                  fi
