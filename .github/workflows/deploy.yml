# =============================================================================
# Deploy — Azure AI Foundry Agent Service (CLI-first + SDK fallback)
# =============================================================================
#
# Deployment workflow for Foundry hosted agents. Uses a CLI-first approach:
#   1. az acr build              — build + push container image to ACR
#   2. az cognitiveservices agent create — version + deploy + start in one shot
#      (fallback: Python SDK create_version + agent start)
#   3. ARM REST                  — publish Agent Application for Playground routing
#      (skipped if Responses API probe succeeds after create)
#
# NOTE: azd does NOT natively support Foundry hosted agents (only Container
# Apps). This workflow uses targeted az CLI + SDK commands instead.
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#
#   OIDC / Federated Identity (recommended):
#     AZURE_CLIENT_ID          — App Registration client ID
#     AZURE_TENANT_ID          — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID    — Target subscription ID
#
#   Agent runtime config (stored as environment secrets in the "production"
#   GitHub Environment so they are gated by branch-protection review):
#     AZURE_AI_AGENTS_ENDPOINT             — Foundry Agent Service endpoint URL
#     AZURE_OPENAI_ENDPOINT                — Azure OpenAI endpoint URL
#     AZURE_OPENAI_DEPLOYMENT              — Model deployment name (e.g. gpt-4.1)
#     APPLICATIONINSIGHTS_CONNECTION_STRING — App Insights (optional)
#
# Required Azure RBAC roles for the service principal:
#
#   1. Contributor (management-plane) — scoped to the resource group:
#      Grants Bicep deployment, ACR operations, resource management.
#      NOTE: RG-scoped Contributor is sufficient for most deploy steps.
#      The Bicep step auto-falls-back to resource-group-scoped deployment.
#
#   1b. (Optional) Contributor at subscription scope:
#       Required for `az deployment sub create` (main.bicep creates the RG).
#       Without this, the deploy falls back to main-rg.bicep (RG-scoped).
#
#   2. Azure AI Developer (data-plane) — scoped to the AI Hub resource:
#      Role ID: 64702f94-c441-49e6-a78b-ef80e0188fee
#      Grants data-plane access to Foundry Agent Service (create/list/update
#      agents, threads, runs).
#
#   3. Azure AI Project Manager — scoped to the AI Hub resource:
#      Required for publishing Agent Applications.
#
# OIDC setup (one-time, run locally):
#   az ad app create --display-name "agentic-ops-advisor-deploy"
#   az ad sp create --id <appId>
#   az role assignment create --assignee <appId> \
#       --role contributor \
#       --scope /subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/rg-agentic-ops-advisor
#   az role assignment create \
#       --assignee-object-id <spObjectId> \
#       --assignee-principal-type ServicePrincipal \
#       --role "Azure AI Developer" \
#       --scope /subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/rg-agentic-ops-advisor/providers/Microsoft.CognitiveServices/accounts/hub-agentops-prod
#   az role assignment create \
#       --assignee-object-id <spObjectId> \
#       --assignee-principal-type ServicePrincipal \
#       --role "Azure AI Project Manager" \
#       --scope /subscriptions/<AZURE_SUBSCRIPTION_ID>/resourceGroups/rg-agentic-ops-advisor/providers/Microsoft.CognitiveServices/accounts/hub-agentops-prod
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "agentic-ops-main",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:tammym-demos/Agentic-Ops-Advisor:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
# =============================================================================

name: Deploy — Foundry Agent Service

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_infra:
                description: "Force Bicep infra re-deploy even without infra/ changes"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

# Prevent concurrent deployments to the same environment.
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write   # Required for OIDC login
    deployments: write

jobs:
    # -------------------------------------------------------------------------
    # 1. Detect whether infra/ files changed (used to gate Bicep step)
    # -------------------------------------------------------------------------
    detect-changes:
        name: Detect changed paths
        runs-on: ubuntu-latest
        outputs:
            infra_changed: ${{ steps.filter.outputs.infra }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 2  # need previous commit to diff against

            - name: Detect infra/ changes
              id: filter
              run: |
                  if git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
                      echo "infra=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "infra=false" >> "$GITHUB_OUTPUT"
                  fi

    # -------------------------------------------------------------------------
    # 2. Deploy Bicep infrastructure (separate job, runs before agent deploy)
    # -------------------------------------------------------------------------
    # This job handles the subscription vs RG-scoped Bicep fallback pattern
    # that some SPs require. After infra is deployed, the agent deploy job
    # uses `azd up --skip-infra` to deploy only the agent and container.
    # -------------------------------------------------------------------------
    deploy-infra:
        name: Deploy infrastructure
        needs: detect-changes
        if: needs.detect-changes.outputs.infra_changed == 'true' || github.event.inputs.force_infra == 'true'
        runs-on: ubuntu-latest
        environment: production

        env:
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            AZURE_RESOURCE_GROUP: rg-agentic-ops-advisor
            AZURE_LOCATION: eastus

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Azure login (OIDC)
              if: ${{ env.AZURE_CLIENT_ID != '' }}
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            - name: Azure login (service principal secret fallback)
              if: ${{ env.AZURE_CLIENT_ID == '' }}
              uses: azure/login@v3
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            - name: Validate Bicep templates
              run: |
                  az bicep build --file infra/main.bicep --stdout > /dev/null
                  az bicep build --file infra/main-rg.bicep --stdout > /dev/null
                  echo "✅ Bicep template validation passed"

            - name: Deploy Bicep infrastructure
              run: |
                  echo "::group::Bicep deployment"
                  DEPLOY_NAME="agentic-ops-advisor-$(date -u +%Y%m%d%H%M%S)"
                  RG_NAME="$AZURE_RESOURCE_GROUP"

                  # Attempt 1: subscription-scoped deploy (requires sub Contributor)
                  echo "🔍 Attempting subscription-scoped deployment..."
                  if az deployment sub create \
                      --name "$DEPLOY_NAME" \
                      --location "$AZURE_LOCATION" \
                      --template-file infra/main.bicep \
                      --parameters @infra/parameters.json \
                      --output table 2>&1; then
                      echo "✅ Subscription-scoped Bicep deployment succeeded."
                  else
                      echo ""
                      echo "⚠️  Subscription-scoped deploy failed (likely AuthorizationFailed)."
                      echo "   Falling back to resource-group-scoped deployment..."

                      # Ensure the RG exists
                      if az group show --name "$RG_NAME" --output none 2>/dev/null; then
                          echo "✅ Resource group '$RG_NAME' already exists."
                      else
                          echo "Creating resource group '$RG_NAME'..."
                          az group create \
                              --name "$RG_NAME" \
                              --location "$AZURE_LOCATION" \
                              --tags project=agentic-ops-advisor environment=prod managedBy=bicep \
                              --output none 2>&1 || {
                              echo "❌ Cannot create resource group '$RG_NAME'."
                              exit 1
                          }
                      fi

                      # Deploy using the RG-scoped template
                      az deployment group create \
                          --name "$DEPLOY_NAME" \
                          --resource-group "$RG_NAME" \
                          --template-file infra/main-rg.bicep \
                          --parameters @infra/parameters.json \
                          --output table

                      echo "✅ Resource-group-scoped Bicep deployment succeeded (fallback)."
                  fi
                  echo "::endgroup::"

            - name: Ensure RBAC roles on AI hub
              run: |
                  PARAMS_FILE="infra/parameters.json"
                  PROJECT_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['projectName']['value'])" 2>/dev/null || echo "agentops")
                  ENV_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['environmentName']['value'])" 2>/dev/null || echo "prod")
                  RG_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['resourceGroupName']['value'])" 2>/dev/null || echo "rg-agentic-ops-advisor")
                  HUB_NAME="hub-${PROJECT_NAME}-${ENV_NAME}"
                  SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                  HUB_SCOPE="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.CognitiveServices/accounts/${HUB_NAME}"

                  # Resolve the object ID of the currently authenticated principal
                  ACCOUNT_TYPE=$(az account show --query user.type -o tsv 2>/dev/null || echo "user")
                  if [[ "${ACCOUNT_TYPE}" == "servicePrincipal" ]]; then
                      SP_NAME=$(az account show --query user.name -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_ID=$(az ad sp show --id "${SP_NAME}" --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="ServicePrincipal"
                  else
                      PRINCIPAL_ID=$(az ad signed-in-user show --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="User"
                  fi

                  if [[ -z "${PRINCIPAL_ID}" ]]; then
                      echo "⚠️  Could not determine principal object ID — skipping role assignment."
                      exit 0
                  fi

                  echo "Principal: ${PRINCIPAL_ID} (${PRINCIPAL_TYPE})"
                  echo "Hub scope: ${HUB_SCOPE}"

                  # Assign roles (idempotent). Each role is checked and created
                  # only if not already present.
                  for ROLE_NAME in "Azure AI Developer" "Cognitive Services Contributor" "Cognitive Services User" "Azure AI Project Manager"; do
                      ROLE_EXISTS=$(az role assignment list \
                          --assignee "${PRINCIPAL_ID}" \
                          --role "${ROLE_NAME}" \
                          --scope "${HUB_SCOPE}" \
                          --query "[].id" -o tsv 2>/dev/null || echo "")

                      if [[ -z "${ROLE_EXISTS}" ]]; then
                          echo "Assigning ${ROLE_NAME} role..."
                          az role assignment create \
                              --assignee-object-id "${PRINCIPAL_ID}" \
                              --assignee-principal-type "${PRINCIPAL_TYPE}" \
                              --role "${ROLE_NAME}" \
                              --scope "${HUB_SCOPE}" \
                              --output none
                          echo "✅ ${ROLE_NAME} role assigned."
                      else
                          echo "✅ ${ROLE_NAME} role already present."
                      fi
                  done

    # -------------------------------------------------------------------------
    # 3. Deploy agent: ACR build → SDK create_version → ARM publish
    # -------------------------------------------------------------------------
    deploy-agent:
        name: Deploy agent
        needs: [detect-changes, deploy-infra]
        # Always run (infra may not have changed)
        if: always() && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
        runs-on: ubuntu-latest
        environment: production

        env:
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            AZURE_RESOURCE_GROUP: rg-agentic-ops-advisor
            AZURE_LOCATION: eastus
            AZURE_CONTAINER_REGISTRY_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
            AZURE_AI_AGENTS_ENDPOINT: ${{ secrets.AZURE_AI_AGENTS_ENDPOINT }}
            AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "false"
            ENABLE_WORK_IQ: "true"
            ENABLE_MCP: "false"
            DB_MODE: sqlite

        steps:
            # ------------------------------------------------------------------
            # Step 1 — Checkout
            # ------------------------------------------------------------------
            - name: Checkout code
              uses: actions/checkout@v5

            # ------------------------------------------------------------------
            # Step 2 — Azure login
            # ------------------------------------------------------------------
            - name: Azure login (OIDC)
              if: ${{ env.AZURE_CLIENT_ID != '' }}
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            - name: Azure login (service principal secret fallback)
              if: ${{ env.AZURE_CLIENT_ID == '' }}
              uses: azure/login@v3
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            # ------------------------------------------------------------------
            # Step 2b — Upgrade Azure CLI to latest
            # ------------------------------------------------------------------
            # The GitHub-hosted runner may ship an older CLI version that lacks
            # newer `az cognitiveservices agent create` flags (--env, --show-logs,
            # --timeout).  Upgrading ensures we have the full parameter set.
            # ------------------------------------------------------------------
            - name: Upgrade Azure CLI
              run: |
                  echo "::group::Upgrade Azure CLI"
                  echo "Before: $(az version -o tsv 2>/dev/null | head -1 || echo 'unknown')"
                  sudo az upgrade --yes --all 2>&1 | tail -5 || \
                      (echo "az upgrade failed — trying apt" && \
                       curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash)
                  echo "After:  $(az version -o tsv 2>/dev/null | head -1 || echo 'unknown')"
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 3 — Set up Python + dependencies
            # ------------------------------------------------------------------
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install ODBC Driver for SQL Server
              run: |
                  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
                  curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
                  sudo apt-get update
                  sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            # ------------------------------------------------------------------
            # Step 4 — Pre-deploy tests (gate: untested code never deploys)
            # ------------------------------------------------------------------
            - name: Set up local SQLite DB
              run: python scripts/setup_local_db.py

            - name: Run tests
              run: |
                  pip install pytest pytest-asyncio
                  python -m pytest tests/ -x --tb=short

            # ------------------------------------------------------------------
            # Step 5 — Build and push container image to ACR
            # ------------------------------------------------------------------
            # Uses `az acr build` for remote build (no local Docker needed).
            # The image tag is the short git SHA for traceability.
            # ------------------------------------------------------------------
            - name: Build and push container image
              run: |
                  echo "::group::Container build & push"
                  ACR_NAME="${AZURE_CONTAINER_REGISTRY_NAME:-crhubagentopsprod}"
                  IMAGE_TAG="$(git rev-parse --short HEAD)"
                  FULL_IMAGE="${ACR_NAME}.azurecr.io/agentic-ops-advisor:${IMAGE_TAG}"

                  echo "🔧 Building: ${FULL_IMAGE}"
                  az acr build \
                      --registry "$ACR_NAME" \
                      --image "agentic-ops-advisor:${IMAGE_TAG}" \
                      .

                  echo "CONTAINER_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
                  echo "✅ Pushed: ${FULL_IMAGE}"
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5b — Ensure AcrPull for project managed identity
            # ------------------------------------------------------------------
            # The Foundry project needs AcrPull on the ACR to pull images.
            # Query both hub and project identities and grant AcrPull.
            # ------------------------------------------------------------------
            - name: Ensure AcrPull on ACR
              run: |
                  ACR_NAME="${AZURE_CONTAINER_REGISTRY_NAME:-crhubagentopsprod}"
                  RG_NAME="${AZURE_RESOURCE_GROUP}"
                  SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                  ACR_SCOPE="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.ContainerRegistry/registries/${ACR_NAME}"
                  HUB_NAME="hub-agentops-prod"
                  PROJ_NAME="proj-agentops-prod"

                  assign_acr_pull() {
                      local PRINCIPAL_ID="$1"
                      local LABEL="$2"
                      if [[ -z "${PRINCIPAL_ID}" ]]; then
                          echo "⚠️  No MI found for ${LABEL}"
                          return
                      fi
                      echo "${LABEL} MI: ${PRINCIPAL_ID}"
                      ACR_PULL_EXISTS=$(az role assignment list \
                          --assignee "${PRINCIPAL_ID}" \
                          --role "AcrPull" \
                          --scope "${ACR_SCOPE}" \
                          --query "[].id" -o tsv 2>/dev/null || echo "")
                      if [[ -z "${ACR_PULL_EXISTS}" ]]; then
                          echo "Assigning AcrPull to ${LABEL} on ${ACR_NAME}..."
                          az role assignment create \
                              --assignee-object-id "${PRINCIPAL_ID}" \
                              --assignee-principal-type "ServicePrincipal" \
                              --role "AcrPull" \
                              --scope "${ACR_SCOPE}" \
                              --output none 2>/dev/null && \
                          echo "✅ AcrPull assigned to ${LABEL}" || \
                          echo "⚠️  AcrPull assignment failed for ${LABEL}"
                      else
                          echo "✅ AcrPull already present for ${LABEL}"
                      fi
                  }

                  # Try hub identity
                  HUB_MI=$(az cognitiveservices account show \
                      --name "${HUB_NAME}" \
                      --resource-group "${RG_NAME}" \
                      --query "identity.principalId" -o tsv 2>/dev/null || echo "")
                  assign_acr_pull "${HUB_MI}" "Hub"

                  # Try project identity (sub-resource of hub)
                  PROJECT_RID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.CognitiveServices/accounts/${HUB_NAME}/projects/${PROJ_NAME}"
                  PROJ_MI=$(az resource show --ids "${PROJECT_RID}" --query "identity.principalId" -o tsv 2>/dev/null || echo "")
                  assign_acr_pull "${PROJ_MI}" "Project"

                  # Try user-assigned identities on the project too
                  PROJ_UAMI_IDS=$(az resource show --ids "${PROJECT_RID}" --query "identity.userAssignedIdentities" -o json 2>/dev/null || echo "{}")
                  if [[ "${PROJ_UAMI_IDS}" != "{}" && "${PROJ_UAMI_IDS}" != "null" && -n "${PROJ_UAMI_IDS}" ]]; then
                      echo "Found user-assigned identities on project"
                      for UAMI_PID in $(echo "${PROJ_UAMI_IDS}" | python3 -c "
                  import sys, json
                  try:
                      d = json.load(sys.stdin)
                      for v in d.values():
                          pid = v.get('principalId', '')
                          if pid:
                              print(pid)
                  except:
                      pass
                  " 2>/dev/null); do
                          assign_acr_pull "${UAMI_PID}" "Project-UAMI"
                      done
                  fi

                  # If project has no MI, try enabling system-assigned MI
                  if [[ -z "${PROJ_MI}" ]]; then
                      echo ""
                      echo "Project has no system MI — enabling system-assigned identity..."
                      az resource update --ids "${PROJECT_RID}" \
                          --set "identity={\"type\":\"SystemAssigned\"}" \
                          --output none 2>/dev/null && {
                          echo "✅ System MI enabled on project"
                          sleep 10
                          PROJ_MI=$(az resource show --ids "${PROJECT_RID}" --query "identity.principalId" -o tsv 2>/dev/null || echo "")
                          assign_acr_pull "${PROJ_MI}" "Project-SystemMI"
                      } || echo "⚠️  Could not enable system MI on project"
                  fi

                  # Also try all user-assigned identities on the hub
                  HUB_UAMI_IDS=$(az cognitiveservices account show \
                      --name "${HUB_NAME}" \
                      --resource-group "${RG_NAME}" \
                      --query "identity.userAssignedIdentities" -o json 2>/dev/null || echo "{}")
                  if [[ "${HUB_UAMI_IDS}" != "{}" && "${HUB_UAMI_IDS}" != "null" && -n "${HUB_UAMI_IDS}" ]]; then
                      echo "Found user-assigned identities on hub"
                      for UAMI_PID in $(echo "${HUB_UAMI_IDS}" | python3 -c "
                  import sys, json
                  try:
                      d = json.load(sys.stdin)
                      for v in d.values():
                          pid = v.get('principalId', '')
                          if pid:
                              print(pid)
                  except:
                      pass
                  " 2>/dev/null); do
                          assign_acr_pull "${UAMI_PID}" "Hub-UAMI"
                      done
                  fi

                  # Wait for RBAC propagation if any assignments were made
                  sleep 15

            # ------------------------------------------------------------------
            # Step 6 — Deploy hosted agent (CLI primary, SDK fallback)
            # ------------------------------------------------------------------
            # Primary: `az cognitiveservices agent create` handles version
            # creation + container deployment + startup in one command.
            # Fallback: deploy_agent.py (SDK create_version) + agent start.
            # Requires Azure CLI >= 2.80 (cognitiveservices agent is core).
            # ------------------------------------------------------------------
            - name: Deploy hosted agent
              id: deploy_agent
              continue-on-error: true
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              run: |
                  echo "::group::Deploy hosted agent"

                  # --- Parse endpoint ---
                  ENDPOINT_TRIMMED=$(echo "$AZURE_AI_AGENTS_ENDPOINT" | xargs)
                  ACCOUNT_NAME=$(echo "$ENDPOINT_TRIMMED" | sed -E 's|https://([^.]+)\..*|\1|')
                  FOUNDRY_PROJECT=$(echo "$ENDPOINT_TRIMMED" | sed -E 's|.*/projects/([^/]+).*|\1|')

                  echo "Endpoint (trimmed): ${ENDPOINT_TRIMMED}"
                  echo "  Account: ${ACCOUNT_NAME}"
                  echo "  Project: ${FOUNDRY_PROJECT}"
                  echo "  Image:   ${CONTAINER_IMAGE}"

                  # --- CLI version check ---
                  CLI_VER=$(az version -o json 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("azure-cli","?"))' 2>/dev/null || echo 'unknown')
                  echo "Azure CLI version: ${CLI_VER}"

                  # ═══════════════════════════════════════════════════════════
                  # PRIMARY: az cognitiveservices agent create
                  # Handles version creation + container deploy + startup
                  # + publish (--protocol responses) in one command.
                  # Delete existing agent first to avoid "already exists" error.
                  # ═══════════════════════════════════════════════════════════
                  echo ""
                  echo "═══ PRIMARY: az cognitiveservices agent create ═══"

                  # Delete existing agent (if any) so create can work fresh
                  echo "Cleaning up existing agent definition..."
                  az cognitiveservices agent delete \
                      --account-name "$ACCOUNT_NAME" \
                      --project-name "$FOUNDRY_PROJECT" \
                      --name "agentic-ops-advisor" \
                      --yes 2>/dev/null && {
                      echo "  Deleted existing agent — waiting 30s for cleanup..."
                      sleep 30
                  } || echo "  No existing agent to delete"

                  AGENT_CREATE_OUTPUT=$(az cognitiveservices agent create \
                      --account-name "$ACCOUNT_NAME" \
                      --project-name "$FOUNDRY_PROJECT" \
                      --name "agentic-ops-advisor" \
                      --image "${CONTAINER_IMAGE}" \
                      --cpu 2 --memory 4Gi \
                      --min-replicas 1 --max-replicas 2 \
                      --protocol responses --protocol-version v1 \
                      --target-port 8088 \
                      --env "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}" \
                            "AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}" \
                            "AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}" \
                            "DB_MODE=sqlite" \
                            "ENABLE_WORK_IQ=true" \
                            "ENABLE_MCP=false" \
                            "PORT=8088" \
                            "APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING}" \
                            "AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED=false" \
                      --show-logs --timeout 600 --skip-acr-check \
                      2>&1) && CREATE_RC=$? || CREATE_RC=$?

                  echo "Agent create exit code: ${CREATE_RC}"
                  echo "Agent create output:"
                  echo "${AGENT_CREATE_OUTPUT}"

                  AGENT_NAME="agentic-ops-advisor"
                  AGENT_VERSION="latest"
                  DEPLOY_DONE=false

                  if [ "$CREATE_RC" -eq 0 ]; then
                      echo "✅ az cognitiveservices agent create succeeded"

                      # Extract version from create output
                      AGENT_VERSION=$(echo "${AGENT_CREATE_OUTPUT}" | python3 -c "
                  import sys, json
                  try:
                      d = json.load(sys.stdin)
                      v = d.get('properties', {}).get('version', d.get('version', ''))
                      print(v if v else 'latest')
                  except:
                      print('latest')
                  " 2>/dev/null || echo "latest")

                      echo "DEPLOYED_AGENT_ID=${AGENT_NAME}/${AGENT_VERSION}" >> "$GITHUB_ENV"
                      echo "AGENT_DEPLOY_METHOD=cli-create" >> "$GITHUB_ENV"
                      echo "  Agent: ${AGENT_NAME} v${AGENT_VERSION}"
                      DEPLOY_DONE=true
                  else
                      echo "⚠️  az cognitiveservices agent create failed (rc=${CREATE_RC})"

                      # ─── Check if version was created but deployment conflicted ───
                      # Error: "Agent version 'N' was created but deployment failed: (conflict)"
                      # Fix: retry with `az cognitiveservices agent start`
                      CONFLICT_VERSION=$(echo "${AGENT_CREATE_OUTPUT}" | grep -oP "Agent version '\K[0-9]+" || true)
                      if [ -n "$CONFLICT_VERSION" ]; then
                          echo ""
                          echo "═══ RETRY: az cognitiveservices agent start (version ${CONFLICT_VERSION}) ═══"
                          AGENT_VERSION="${CONFLICT_VERSION}"
                          AGENT_START_OUTPUT=$(az cognitiveservices agent start \
                              --account-name "$ACCOUNT_NAME" \
                              --project-name "$FOUNDRY_PROJECT" \
                              --name "$AGENT_NAME" \
                              --agent-version "$AGENT_VERSION" \
                              --show-logs \
                              2>&1) && START_RC=$? || START_RC=$?

                          echo "  agent start output (rc=${START_RC}):"
                          echo "${AGENT_START_OUTPUT}"

                          if [ "$START_RC" -eq 0 ]; then
                              echo "✅ Agent started via conflict-retry"
                              echo "DEPLOYED_AGENT_ID=${AGENT_NAME}/${AGENT_VERSION}" >> "$GITHUB_ENV"
                              echo "AGENT_DEPLOY_METHOD=cli-create-restart" >> "$GITHUB_ENV"
                              DEPLOY_DONE=true
                          else
                              echo "⚠️  agent start also failed"
                          fi
                      fi
                  fi

                  # ═══════════════════════════════════════════════════════
                  # FALLBACK: deploy_agent.py (SDK create_version) + agent start
                  # ═══════════════════════════════════════════════════════
                  if [ "$DEPLOY_DONE" != "true" ]; then
                      echo ""
                      echo "═══ FALLBACK: deploy_agent.py (SDK create_version) + agent start ═══"
                      SDK_OUTPUT=$(python scripts/deploy_agent.py 2>&1) && SDK_RC=$? || SDK_RC=$?
                      echo "${SDK_OUTPUT}"

                      if [ "$SDK_RC" -eq 0 ]; then
                          echo "✅ SDK deploy_agent.py succeeded"

                          # Parse version from SDK output: "✅ Hosted agent version created: name/version"
                          SDK_VERSION=$(echo "${SDK_OUTPUT}" | grep -oP 'created: [^/]+/\K[0-9]+' || true)
                          if [ -n "$SDK_VERSION" ]; then
                              AGENT_VERSION="${SDK_VERSION}"
                          fi

                          echo "DEPLOYED_AGENT_ID=${AGENT_NAME}/${AGENT_VERSION}" >> "$GITHUB_ENV"
                          echo "AGENT_DEPLOY_METHOD=sdk-fallback" >> "$GITHUB_ENV"

                          # SDK create_version does NOT auto-start — use agent start
                          echo ""
                          echo "═══ Starting agent container (version ${AGENT_VERSION}) ═══"
                          AGENT_START_OUTPUT=$(az cognitiveservices agent start \
                              --account-name "$ACCOUNT_NAME" \
                              --project-name "$FOUNDRY_PROJECT" \
                              --name "$AGENT_NAME" \
                              --agent-version "$AGENT_VERSION" \
                              --show-logs \
                              2>&1) && START_RC=$? || START_RC=$?

                          echo "  agent start output (rc=${START_RC}):"
                          echo "${AGENT_START_OUTPUT}"
                          if [ "$START_RC" -eq 0 ]; then
                              echo "✅ Agent started via SDK + CLI start"
                          else
                              echo "⚠️  agent start failed — container may need manual intervention"
                          fi
                      else
                          echo "❌ SDK deploy_agent.py also failed (rc=${SDK_RC})"
                          echo "AGENT_DEPLOY_METHOD=failed" >> "$GITHUB_ENV"
                      fi
                  fi

                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 7 — Publish Agent Application (probe first, then ARM)
            # ------------------------------------------------------------------
            # If `agent create` already set up the Responses protocol, the ARM
            # publish may not be needed. Probe the Responses endpoint first.
            # ------------------------------------------------------------------
            - name: Publish agent application
              continue-on-error: true
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              run: |
                  echo "::group::Publish agent application"

                  AGENT_ID="${DEPLOYED_AGENT_ID:-}"
                  DEPLOY_METHOD="${AGENT_DEPLOY_METHOD:-unknown}"
                  echo "Deploy method: ${DEPLOY_METHOD}"
                  echo "Agent ID: ${AGENT_ID:-<none>}"

                  if [ -z "$AGENT_ID" ] && [ "$DEPLOY_METHOD" = "failed" ]; then
                      echo "⚠️  No agent deployed — skipping publish."
                      echo "::endgroup::"
                      exit 0
                  fi

                  AGENT_NAME=$(echo "${AGENT_ID:-agentic-ops-advisor/latest}" | cut -d'/' -f1)
                  AGENT_VERSION=$(echo "${AGENT_ID:-agentic-ops-advisor/latest}" | cut -d'/' -f2)

                  ENDPOINT_TRIMMED=$(echo "$AZURE_AI_AGENTS_ENDPOINT" | xargs)
                  ACCOUNT_NAME=$(echo "$ENDPOINT_TRIMMED" | sed -E 's|https://([^.]+)\..*|\1|')
                  FOUNDRY_PROJECT=$(echo "$ENDPOINT_TRIMMED" | sed -E 's|.*/projects/([^/]+).*|\1|')

                  # --- Probe: is the Responses endpoint already live? ---
                  ARM_PUBLISH_SUCCESS=false

                  echo ""
                  echo "Probing Responses API..."
                  ACCESS_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv 2>/dev/null) || true
                  PROBE_URL="${ENDPOINT_TRIMMED}/applications/agentic-ops-advisor/protocols/openai/responses?api-version=2025-11-15-preview"
                  echo "  Probe URL: ${PROBE_URL}"

                  if [ -n "$ACCESS_TOKEN" ]; then
                      PROBE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PROBE_URL" \
                          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                          -H "Content-Type: application/json" \
                          -d '{"input":"ping","model":"gpt-4.1"}' \
                          --max-time 30) || PROBE_RESPONSE="000"

                      echo "  Responses API probe: HTTP ${PROBE_RESPONSE}"
                      if [ "$PROBE_RESPONSE" = "200" ] || [ "$PROBE_RESPONSE" = "201" ]; then
                          echo "✅ Responses API is live — skipping ARM publish"
                          ARM_PUBLISH_SUCCESS=true
                      fi
                  else
                      echo "  ⚠️  Could not get access token for probe — proceeding to ARM publish"
                  fi

                  # --- ARM publish (only if probe shows API not live) ---
                  if [ "$ARM_PUBLISH_SUCCESS" != "true" ]; then
                      echo ""
                      echo "Responses API not live yet — attempting ARM publish..."

                      # Resolve project resource ID
                      PROJECT_RESOURCE_ID=$(az resource list \
                          --resource-group "$AZURE_RESOURCE_GROUP" \
                          --resource-type "Microsoft.CognitiveServices/accounts/projects" \
                          --query "[0].id" -o tsv 2>/dev/null)

                      if [ -z "$PROJECT_RESOURCE_ID" ]; then
                          PROJECT_RESOURCE_ID="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT_NAME}/projects/${FOUNDRY_PROJECT}"
                          echo "  Constructed PROJECT_RESOURCE_ID=${PROJECT_RESOURCE_ID}"
                      else
                          echo "  PROJECT_RESOURCE_ID=${PROJECT_RESOURCE_ID}"
                      fi

                      APP_NAME="${AGENT_NAME}"

                      for API_VERSION in "2025-12-01" "2026-01-15-preview" "2025-10-01-preview"; do
                          echo ""
                          echo "Publishing Agent Application (api-version=${API_VERSION})..."
                          APP_URL="https://management.azure.com${PROJECT_RESOURCE_ID}/applications/${APP_NAME}?api-version=${API_VERSION}"
                          echo "  URL: ${APP_URL}"

                          APP_RESPONSE=$(az rest --method PUT \
                              --url "${APP_URL}" \
                              --headers "Content-Type=application/json" \
                              --body "{\"properties\":{\"agents\":[{\"agentName\":\"${AGENT_NAME}\"}]}}" \
                              2>&1) && APP_RC=$? || APP_RC=$?

                          echo "  Response (rc=${APP_RC}): ${APP_RESPONSE}"

                          if [ "$APP_RC" -ne 0 ]; then
                              echo "  ⚠️  Application publish failed with api-version=${API_VERSION} (rc=${APP_RC})"
                              continue
                          fi

                          echo "Publishing Agent Deployment (api-version=${API_VERSION})..."
                          DEPLOY_URL="https://management.azure.com${PROJECT_RESOURCE_ID}/applications/${APP_NAME}/agentDeployments/production?api-version=${API_VERSION}"
                          echo "  URL: ${DEPLOY_URL}"

                          DEPLOY_RESPONSE=$(az rest --method PUT \
                              --url "${DEPLOY_URL}" \
                              --headers "Content-Type=application/json" \
                              --body "{\"properties\":{\"displayName\":\"Production Hosted Deployment\",\"deploymentType\":\"Hosted\",\"minReplicas\":1,\"maxReplicas\":2,\"protocols\":[{\"protocol\":\"Responses\",\"version\":\"1.0\"}],\"agents\":[{\"agentName\":\"${AGENT_NAME}\",\"agentVersion\":\"${AGENT_VERSION}\"}]}}" \
                              2>&1) && DEPLOY_RC=$? || DEPLOY_RC=$?

                          echo "  Response (rc=${DEPLOY_RC}): ${DEPLOY_RESPONSE}"

                          if [ "$DEPLOY_RC" -eq 0 ]; then
                              ARM_PUBLISH_SUCCESS=true
                              echo "✅ ARM publish succeeded with api-version=${API_VERSION}"
                              break
                          else
                              echo "  ⚠️  Deployment publish failed with api-version=${API_VERSION} (rc=${DEPLOY_RC})"
                          fi
                      done

                      # --- Python SDK fallback if ARM REST failed ---
                      if [ "$ARM_PUBLISH_SUCCESS" != "true" ]; then
                          echo ""
                          echo "⚠️  ARM REST publish failed on all API versions. Trying Python SDK fallback..."
                          export PROJECT_RESOURCE_ID AGENT_NAME AGENT_VERSION
                          python3 - <<'PYEOF'
                  import os, sys, json

                  try:
                      from azure.identity import DefaultAzureCredential
                      import requests

                      credential = DefaultAzureCredential()
                      token = credential.get_token("https://management.azure.com/.default")

                      project_resource_id = os.environ.get("PROJECT_RESOURCE_ID", "")
                      agent_name = os.environ.get("AGENT_NAME", "")
                      agent_version = os.environ.get("AGENT_VERSION", "")

                      if not project_resource_id or not agent_name:
                          print("❌ Missing PROJECT_RESOURCE_ID or AGENT_NAME for SDK fallback.")
                          sys.exit(1)

                      headers = {
                          "Authorization": f"Bearer {token.token}",
                          "Content-Type": "application/json",
                      }

                      for api_version in ["2025-12-01", "2026-01-15-preview", "2025-10-01-preview"]:
                          print(f"\n  Python fallback: api-version={api_version}")

                          app_url = f"https://management.azure.com{project_resource_id}/applications/{agent_name}?api-version={api_version}"
                          app_body = {"properties": {"agents": [{"agentName": agent_name}]}}
                          print(f"  PUT {app_url}")

                          resp = requests.put(app_url, json=app_body, headers=headers, timeout=60)
                          print(f"  Application response: {resp.status_code} {resp.text[:500]}")
                          if resp.status_code >= 400:
                              print(f"  ⚠️  Application publish failed ({resp.status_code})")
                              continue

                          deploy_url = f"https://management.azure.com{project_resource_id}/applications/{agent_name}/agentDeployments/production?api-version={api_version}"
                          deploy_body = {
                              "properties": {
                                  "displayName": "Production Hosted Deployment",
                                  "deploymentType": "Hosted",
                                  "minReplicas": 1,
                                  "maxReplicas": 2,
                                  "protocols": [{"protocol": "Responses", "version": "1.0"}],
                                  "agents": [{"agentName": agent_name, "agentVersion": agent_version}],
                              }
                          }
                          print(f"  PUT {deploy_url}")

                          resp = requests.put(deploy_url, json=deploy_body, headers=headers, timeout=60)
                          print(f"  Deployment response: {resp.status_code} {resp.text[:500]}")
                          if resp.status_code < 400:
                              print(f"✅ Python SDK fallback succeeded with api-version={api_version}")
                              sys.exit(0)
                          else:
                              print(f"  ⚠️  Deployment publish failed ({resp.status_code})")

                      print("❌ Python SDK fallback also failed on all API versions.")
                      print("   Please publish manually via Azure AI Foundry Portal UI:")
                      print("   https://ai.azure.com → Projects → Agent → Publish")
                      sys.exit(1)

                  except Exception as e:
                      print(f"❌ Python SDK fallback error: {e}")
                      print("   Please publish manually via Azure AI Foundry Portal UI.")
                      sys.exit(1)
                  PYEOF
                          PYTHON_RC=$?
                          if [ "$PYTHON_RC" -ne 0 ]; then
                              echo "⚠️  All publish methods failed. Publish manually via Azure AI Foundry Portal."
                          fi
                      fi
                  fi

                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 8 — Wait for agent warmup (active readiness probe)
            # ------------------------------------------------------------------
            - name: Wait for agent warmup
              run: |
                  echo "Waiting 60s for container warmup..."
                  sleep 60
                  echo "Checking agent readiness..."
                  python - <<'READYEOF'
                  import os, sys, time
                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "").strip()
                  if not endpoint:
                      print("⚠️  No endpoint — skipping readiness check")
                      sys.exit(0)
                  try:
                      from azure.identity import DefaultAzureCredential
                      from azure.ai.projects import AIProjectClient
                      project = AIProjectClient(
                          endpoint=endpoint,
                          credential=DefaultAzureCredential(),
                          allow_preview=True,
                      )
                      agent_name = "agentic-ops-advisor"
                      max_checks = 6
                      for i in range(max_checks):
                          try:
                              agent = project.agents.get(agent_name=agent_name)
                              print(f"✅ Agent responsive: {agent.name} (check {i+1}/{max_checks})")
                              sys.exit(0)
                          except Exception as e:
                              print(f"  Readiness check {i+1}/{max_checks}: {str(e)[:120]}")
                              if i < max_checks - 1:
                                  time.sleep(10)
                      print("⚠️  Agent not responsive after readiness checks — proceeding anyway")
                  except Exception as e:
                      print(f"⚠️  Readiness check error: {e}")
                  READYEOF

            # ------------------------------------------------------------------
            # Step 9 — Smoke test: Responses API
            # ------------------------------------------------------------------
            - name: Smoke test (Responses API)
              id: smoke_test
              continue-on-error: true
              run: |
                  echo "::group::Smoke test — Responses API"
                  python - <<'EOF'
                  import os, sys, json, time
                  sys.path.insert(0, os.getcwd())

                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "").strip()
                  if not endpoint:
                      print("⚠️  Smoke test skipped — AZURE_AI_AGENTS_ENDPOINT not set.")
                      sys.exit(0)

                  agent_name = "agentic-ops-advisor"
                  print(f"Testing agent: {agent_name}")
                  print(f"Endpoint: {endpoint}")

                  # --- SDK-based invocation (Responses API with agent_reference) ---
                  # This is the correct invocation pattern per Foundry docs:
                  # https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
                  try:
                      from azure.identity import DefaultAzureCredential
                      from azure.ai.projects import AIProjectClient

                      project = AIProjectClient(
                          endpoint=endpoint,
                          credential=DefaultAzureCredential(),
                          allow_preview=True,
                      )

                      # Verify agent exists
                      agent = project.agents.get(agent_name=agent_name)
                      print(f"✅ Agent found: {agent.name}")

                      # Invoke via Responses API
                      openai = project.get_openai_client()
                      # Use a simple probe to avoid tool calls — must respond under
                      # Foundry's 100s gateway HttpClient.Timeout
                      probe = "Hello! Respond with one sentence confirming you are the Agentic Ops Advisor."
                      print(f"Probe query: {probe}")

                      max_retries = 5
                      retry_delay = 20
                      for attempt in range(max_retries):
                          try:
                              response = openai.responses.create(
                                  extra_body={
                                      "agent_reference": {
                                          "name": agent.name,
                                          "type": "agent_reference",
                                      }
                                  },
                                  input=probe,
                              )

                              status = getattr(response, "status", "unknown")
                              print(f"  Response status: {status}")

                              # Log error details when status is failed
                              if status == "failed":
                                  err = getattr(response, "error", None)
                                  if err:
                                      err_code = getattr(err, "code", "unknown")
                                      err_msg = getattr(err, "message", str(err))
                                      print(f"  Error code: {err_code}")
                                      print(f"  Error message: {err_msg[:300]}")
                                  else:
                                      print("  No error details on response")

                              # Log incomplete details if present
                              incomplete = getattr(response, "incomplete_details", None)
                              if incomplete:
                                  print(f"  Incomplete details: {incomplete}")

                              # Log all output items for diagnostics
                              for item in response.output:
                                  item_type = getattr(item, "type", "unknown")
                                  if item_type == "function_call":
                                      name = getattr(item, "name", "?")
                                      print(f"  [Tool] {name} — handled by container")
                                  elif item_type == "message":
                                      print(f"  [Message] role={getattr(item, 'role', '?')}")
                                  else:
                                      print(f"  [Output item] type={item_type}")

                              output_text = response.output_text or ""
                              if output_text:
                                  print(f"✅ Smoke test PASSED")
                                  print(f"Response preview: {output_text[:300]}")
                                  sys.exit(0)
                              else:
                                  if attempt < max_retries - 1:
                                      print(f"  No output text — retrying in {retry_delay}s (attempt {attempt + 1}/{max_retries})...")
                                      time.sleep(retry_delay)
                                  else:
                                      print(f"⚠️  Smoke test: response received but no output text after {max_retries} attempts")
                                      sys.exit(1)

                          except Exception as e:
                              err_str = str(e)
                              print(f"  Request error (attempt {attempt + 1}/{max_retries}): {err_str[:300]}")
                              if attempt < max_retries - 1:
                                  time.sleep(retry_delay)
                              else:
                                  print(f"⚠️  Smoke test failed after {max_retries} attempts")
                                  sys.exit(1)

                  except ImportError as e:
                      print(f"⚠️  SDK not available ({e}), falling back to REST probe")
                      # Minimal REST fallback — project-level endpoint for hosted agents
                      import requests
                      from azure.identity import DefaultAzureCredential
                      credential = DefaultAzureCredential()
                      token = credential.get_token("https://ai.azure.com/.default")
                      base = endpoint.rstrip("/")
                      # Extract project ID from endpoint (format: https://{endpoint}/api/projects/{project})
                      project_id = endpoint.split("/projects/")[-1].rstrip("/")
                      url = f"{base}/api/projects/{project_id}/openai/responses?api-version=2025-11-15-preview"
                      print(f"  Testing: {url}")
                      resp = requests.post(
                          url,
                          json={
                              "input": "health check",
                              "agent_reference": {
                                  "name": agent_name,
                                  "type": "agent_reference"
                              }
                          },
                          headers={"Authorization": f"Bearer {token.token}", "Content-Type": "application/json"},
                          timeout=60,
                      )
                      print(f"  Status: {resp.status_code}")
                      if resp.status_code < 400:
                          print("✅ REST probe passed")
                      else:
                          print(f"⚠️  REST probe failed: {resp.text[:200]}")
                          sys.exit(1)

                  except Exception as e:
                      print(f"⚠️  Smoke test error: {e}")
                      sys.exit(1)
                  EOF
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 10 — Post deployment status summary
            # ------------------------------------------------------------------
            - name: Post deployment status
              if: always()
              run: |
                  STATUS="${{ job.status }}"
                  SHA="${{ github.sha }}"
                  REF="${{ github.ref_name }}"
                  ACTOR="${{ github.actor }}"
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  SMOKE_TEST="${{ steps.smoke_test.outcome }}"

                  echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Field        | Value |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|--------------|-------|" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Status**   | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Commit**   | \`${SHA:0:8}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Branch**   | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Actor**    | ${ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Time**     | ${TIMESTAMP} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"

                  if [ "$STATUS" = "success" ]; then
                      echo "✅ **Agent deployment succeeded.** The agent is live on Azure AI Foundry Agent Service." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "❌ **Agent deployment failed.** Check the workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "### Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  
                  if [ "$SMOKE_TEST" = "success" ]; then
                      echo "- ✅ **Responses API:** Passed" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST" = "failure" ]; then
                      echo "- ⚠️  **Responses API:** Failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$SMOKE_TEST" = "skipped" ]; then
                      echo "- ℹ️  **Responses API:** Skipped" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "- ❓ **Responses API:** Unknown" >> "$GITHUB_STEP_SUMMARY"
                  fi

                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "### Next Steps" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Test the agent in the Azure AI Foundry Playground" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Review logs in Application Insights" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Run evaluations: \`python eval/run_eval.py\`" >> "$GITHUB_STEP_SUMMARY"
