# =============================================================================
# Deploy — Azure AI Foundry Agent Service
# =============================================================================
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#
#   OIDC / Federated Identity (recommended):
#     AZURE_CLIENT_ID          — App Registration client ID
#     AZURE_TENANT_ID          — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID    — Target subscription ID
#
#   OR Service Principal secret (legacy):
#     AZURE_CREDENTIALS        — JSON output of `az ad sp create-for-rbac
#                                  --name "agentic-ops-advisor-deploy"
#                                  --role contributor
#                                  --scopes /subscriptions/<id>/resourceGroups/rg-agentic-ops-advisor
#                                  --sdk-auth`
#
#   Agent runtime config (stored as environment secrets in the "production"
#   GitHub Environment so they are gated by branch-protection review):
#     AZURE_AI_AGENTS_ENDPOINT             — Foundry Agent Service endpoint URL
#     AZURE_OPENAI_ENDPOINT                — Azure OpenAI endpoint URL
#     AZURE_OPENAI_DEPLOYMENT              — Model deployment name (e.g. gpt-4.1)
#     APPLICATIONINSIGHTS_CONNECTION_STRING — App Insights (optional)
#
# OIDC setup (one-time, run locally):
#   az ad app create --display-name "agentic-ops-advisor-deploy"
#   az ad sp create --id <appId>
#   az role assignment create --assignee <appId> \
#       --role contributor \
#       --scope /subscriptions/e0b48569-71a2-40fe-9b7a-2fb859f31288/resourceGroups/rg-agentic-ops-advisor
#   # Grant data-plane access to the AI hub (required for Foundry Agent Service APIs):
#   az role assignment create \
#       --assignee-object-id <spObjectId> \
#       --assignee-principal-type ServicePrincipal \
#       --role "Azure AI Developer" \
#       --scope /subscriptions/e0b48569-71a2-40fe-9b7a-2fb859f31288/resourceGroups/rg-agentic-ops-advisor/providers/Microsoft.CognitiveServices/accounts/hub-agentops-prod
#   # Add federated credential for this repo + branch:
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "agentic-ops-main",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:tammym-demos/Agentic-Ops-Advisor:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
# =============================================================================

name: Deploy — Foundry Agent Service

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_infra:
                description: "Force Bicep infra re-deploy even without infra/ changes"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

# Prevent concurrent deployments to the same environment.
concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write   # Required for OIDC login
    deployments: write

jobs:
    # -------------------------------------------------------------------------
    # 1. Detect whether infra/ files changed (used to gate Bicep step)
    # -------------------------------------------------------------------------
    detect-changes:
        name: Detect changed paths
        runs-on: ubuntu-latest
        outputs:
            infra_changed: ${{ steps.filter.outputs.infra }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2  # need previous commit to diff against

            - name: Detect infra/ changes
              id: filter
              run: |
                  if git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
                      echo "infra=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "infra=false" >> "$GITHUB_OUTPUT"
                  fi

    # -------------------------------------------------------------------------
    # 2. Deploy infrastructure + agent
    # -------------------------------------------------------------------------
    deploy:
        name: Deploy to production
        needs: detect-changes
        runs-on: ubuntu-latest
        environment: production   # GitHub Environment with protection rules

        env:
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            AZURE_RESOURCE_GROUP: rg-agentic-ops-advisor
            AZURE_LOCATION: eastus2
            AZURE_AI_AGENTS_ENDPOINT: ${{ secrets.AZURE_AI_AGENTS_ENDPOINT }}
            AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "false"
            ENABLE_WORK_IQ: "true"
            ENABLE_MCP: "false"
            DB_MODE: sqlite

        steps:
            # ------------------------------------------------------------------
            # Step 1 — Checkout
            # ------------------------------------------------------------------
            - name: Checkout code
              uses: actions/checkout@v4

            # ------------------------------------------------------------------
            # Step 2 — Azure login (OIDC preferred; falls back to SP secret)
            # ------------------------------------------------------------------
            - name: Azure login (OIDC)
              if: ${{ env.AZURE_CLIENT_ID != '' }}
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            - name: Azure login (service principal secret fallback)
              if: ${{ env.AZURE_CLIENT_ID == '' }}
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
              env:
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

            # ------------------------------------------------------------------
            # Step 3 — Set up Python
            # ------------------------------------------------------------------
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            # ------------------------------------------------------------------
            # Step 4 — Deploy Bicep infrastructure (conditional)
            # ------------------------------------------------------------------
            - name: Deploy Bicep infrastructure
              if: >-
                  needs.detect-changes.outputs.infra_changed == 'true' ||
                  github.event.inputs.force_infra == 'true'
              run: |
                  echo "::group::Bicep deployment"
                  az deployment sub create \
                      --name "agentic-ops-advisor-$(date -u +%Y%m%d%H%M%S)" \
                      --location "$AZURE_LOCATION" \
                      --template-file infra/main.bicep \
                      --parameters @infra/parameters.json \
                      --output table
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 4b — Ensure Azure AI Developer role on the AI hub
            # (data-plane access required by Foundry Agent Service APIs)
            # ------------------------------------------------------------------
            - name: Ensure Azure AI Developer role on AI hub
              run: |
                  PARAMS_FILE="infra/parameters.json"
                  PROJECT_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['projectName']['value'])" 2>/dev/null || echo "agentops")
                  ENV_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['environmentName']['value'])" 2>/dev/null || echo "prod")
                  RG_NAME=$(python3 -c "import json; d=json.load(open('${PARAMS_FILE}')); print(d['parameters']['resourceGroupName']['value'])" 2>/dev/null || echo "rg-agentic-ops-advisor")
                  HUB_NAME="hub-${PROJECT_NAME}-${ENV_NAME}"
                  HUB_SCOPE="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.CognitiveServices/accounts/${HUB_NAME}"

                  # Resolve the object ID of the currently authenticated principal
                  ACCOUNT_TYPE=$(az account show --query user.type -o tsv 2>/dev/null || echo "user")
                  if [[ "${ACCOUNT_TYPE}" == "servicePrincipal" ]]; then
                      SP_NAME=$(az account show --query user.name -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_ID=$(az ad sp show --id "${SP_NAME}" --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="ServicePrincipal"
                  else
                      PRINCIPAL_ID=$(az ad signed-in-user show --query id -o tsv 2>/dev/null || echo "")
                      PRINCIPAL_TYPE="User"
                  fi

                  if [[ -z "${PRINCIPAL_ID}" ]]; then
                      echo "⚠️  Could not determine principal object ID — skipping Azure AI Developer role assignment."
                      exit 0
                  fi

                  echo "Principal: ${PRINCIPAL_ID} (${PRINCIPAL_TYPE})"
                  echo "Hub scope: ${HUB_SCOPE}"

                  # Idempotent: only assign if not already present
                  ROLE_EXISTS=$(az role assignment list \
                      --assignee "${PRINCIPAL_ID}" \
                      --role "Azure AI Developer" \
                      --scope "${HUB_SCOPE}" \
                      --query "[].id" -o tsv 2>/dev/null || echo "")

                  if [[ -z "${ROLE_EXISTS}" ]]; then
                      echo "Assigning Azure AI Developer role to ${PRINCIPAL_ID}..."
                      az role assignment create \
                          --assignee-object-id "${PRINCIPAL_ID}" \
                          --assignee-principal-type "${PRINCIPAL_TYPE}" \
                          --role "Azure AI Developer" \
                          --scope "${HUB_SCOPE}" \
                          --output none
                      echo "✅ Azure AI Developer role assigned on ${HUB_NAME}."
                  else
                      echo "✅ Azure AI Developer role already present on ${HUB_NAME}."
                  fi

            # ------------------------------------------------------------------
            # Step 5a — Resolve ACR login server
            # ------------------------------------------------------------------
            - name: Resolve ACR login server
              run: |
                  # Try Bicep outputs first; fall back to convention-based name
                  ACR_NAME=$(az deployment sub show \
                      --name "$(az deployment sub list --location "$AZURE_LOCATION" \
                          --query "[?starts_with(name,'agentic-ops-advisor')].name | [0]" -o tsv 2>/dev/null || echo '')" \
                      --query "properties.outputs.acrName.value" -o tsv 2>/dev/null || echo '')

                  if [ -z "$ACR_NAME" ]; then
                      # Convention: cr<hubName> with hyphens stripped
                      ACR_NAME="crhubagentopsprod"
                      echo "⚠️  Could not resolve ACR from Bicep outputs — using convention: $ACR_NAME"
                  fi

                  ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv 2>/dev/null || echo "${ACR_NAME}.azurecr.io")
                  echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
                  echo "ACR_NAME=${ACR_NAME}" >> "$GITHUB_ENV"
                  echo "✅ ACR: ${ACR_LOGIN_SERVER}"

            # ------------------------------------------------------------------
            # Step 5b — Build and push container image to ACR
            # ------------------------------------------------------------------
            - name: Build and push container image
              run: |
                  echo "::group::Container build & push"
                  IMAGE_TAG="${{ github.sha }}"
                  IMAGE_NAME="${ACR_LOGIN_SERVER}/agentic-ops-advisor"

                  # Authenticate to ACR
                  az acr login --name "$ACR_NAME"

                  # Build the container image
                  docker build \
                      --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
                      --tag "${IMAGE_NAME}:latest" \
                      --label "org.opencontainers.image.revision=${{ github.sha }}" \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      .

                  # Push both tags
                  docker push "${IMAGE_NAME}:${IMAGE_TAG}"
                  docker push "${IMAGE_NAME}:latest"

                  echo "CONTAINER_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"
                  echo "✅ Pushed: ${IMAGE_NAME}:${IMAGE_TAG}"
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 5c — Deploy container agent to Foundry Agent Service
            # ------------------------------------------------------------------
            - name: Deploy container agent to Foundry Agent Service
              run: |
                  echo "::group::Agent deployment"
                  python - <<'EOF'
                  import os, sys
                  from azure.ai.agents import AgentsClient
                  from azure.identity import DefaultAzureCredential

                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "")
                  if not endpoint:
                      print("⚠️  AZURE_AI_AGENTS_ENDPOINT not configured — skipping agent deploy.")
                      sys.exit(0)

                  client = AgentsClient(
                      endpoint=endpoint,
                      credential=DefaultAzureCredential(),
                  )

                  # Read system prompt from file
                  prompt_path = "agent/system_prompt.md"
                  system_prompt = open(prompt_path).read() if os.path.exists(prompt_path) else (
                      "You are the Agentic Ops Advisor — a governed AI agent for "
                      "root-cause and change-context reasoning over infrastructure telemetry."
                  )

                  deployment_name = os.environ.get("AZURE_OPENAI_DEPLOYMENT", "gpt-4.1")
                  container_image = os.environ.get("CONTAINER_IMAGE", "")

                  # Upsert agent: list existing, update if found, create if not
                  agents = client.list_agents()
                  existing = next((a for a in agents if a.name == "agentic-ops-advisor"), None)

                  agent_kwargs = dict(
                      model=deployment_name,
                      name="agentic-ops-advisor",
                      instructions=system_prompt,
                      description="Agentic Ops Advisor — containerised agent for infrastructure telemetry & change-context reasoning",
                      metadata={"container_image": container_image} if container_image else {},
                  )

                  if existing:
                      agent_obj = client.update_agent(assistant_id=existing.id, **agent_kwargs)
                      print(f"✅ Updated agent: {agent_obj.id}")
                  else:
                      agent_obj = client.create_agent(**agent_kwargs)
                      print(f"✅ Created agent: {agent_obj.id}")

                  if container_image:
                      print(f"📦 Container image: {container_image}")

                  # Persist agent ID for subsequent steps
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"DEPLOYED_AGENT_ID={agent_obj.id}\n")
                  EOF
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 6 — Smoke test: send one query, verify response
            # ------------------------------------------------------------------
            - name: Smoke test
              run: |
                  echo "::group::Smoke test"
                  python - <<'EOF'
                  import os, sys, time

                  _SMOKE_TEST_TIMEOUT_SECONDS = 120
                  endpoint = os.environ.get("AZURE_AI_AGENTS_ENDPOINT", "")
                  agent_id = os.environ.get("DEPLOYED_AGENT_ID", "")

                  if not endpoint or not agent_id:
                      print("⚠️  Smoke test skipped — agent not deployed (endpoint or agent ID missing).")
                      sys.exit(0)

                  from azure.ai.agents import AgentsClient
                  from azure.ai.agents.models import MessageRole
                  from azure.identity import DefaultAzureCredential

                  client = AgentsClient(
                      endpoint=endpoint,
                      credential=DefaultAzureCredential(),
                  )

                  probe = "What is the GPU utilization trend for the last 24 hours?"
                  print(f"Probe query: {probe}")

                  thread = client.threads.create()
                  client.messages.create(
                      thread_id=thread.id,
                      role="user",
                      content=probe,
                  )

                  run = client.runs.create_and_process(
                      thread_id=thread.id,
                      assistant_id=agent_id,
                  )

                  deadline = time.time() + _SMOKE_TEST_TIMEOUT_SECONDS
                  while run.status in ("queued", "in_progress") and time.time() < deadline:
                      time.sleep(3)
                      run = client.runs.get(thread_id=thread.id, run_id=run.id)

                  if run.status != "completed":
                      print(f"❌ Smoke test FAILED — run status: {run.status}")
                      sys.exit(1)

                  response_text = client.get_last_message_text_by_role(
                      thread_id=thread.id,
                      role=MessageRole.AGENT,
                  )
                  if not response_text:
                      print("❌ Smoke test FAILED — no agent response received.")
                      sys.exit(1)

                  print(f"✅ Smoke test PASSED\nResponse preview: {response_text[:300]}")
                  EOF
                  echo "::endgroup::"

            # ------------------------------------------------------------------
            # Step 7 — Post deployment status summary
            # ------------------------------------------------------------------
            - name: Post deployment status
              if: always()
              run: |
                  STATUS="${{ job.status }}"
                  SHA="${{ github.sha }}"
                  REF="${{ github.ref_name }}"
                  ACTOR="${{ github.actor }}"
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  AGENT_ID="${DEPLOYED_AGENT_ID:-not deployed}"
                  CONTAINER="${CONTAINER_IMAGE:-not built}"

                  echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Field        | Value |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|--------------|-------|" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Status**   | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Commit**   | \`${SHA:0:8}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Branch**   | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Actor**    | ${ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Agent ID** | \`${AGENT_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Container** | \`${CONTAINER}\` |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Time**     | ${TIMESTAMP} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"

                  if [ "$STATUS" = "success" ]; then
                      echo "✅ **Deployment succeeded.** The agent is live on Azure AI Foundry Agent Service." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "❌ **Deployment failed.** Check the logs above for details." >> "$GITHUB_STEP_SUMMARY"
                  fi
