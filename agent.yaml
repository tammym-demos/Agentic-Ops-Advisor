# =============================================================================
# Agentic Ops Advisor — Azure AI Foundry Agent Service Manifest
# =============================================================================
# This manifest defines the container-based agent deployment for the Agentic
# Ops Advisor on Azure AI Foundry Agent Service.
#
# Usage:
#   1. Referenced by azure.yaml (line 84: agentManifest: agent.yaml)
#      for azd ai agent extension deployments via `azd up`
#   2. Used by .github/workflows/deploy.yml for GitHub Actions CI/CD
#   3. Serves as source of truth for agent capabilities and container config
#
# Prerequisites:
#   - Container image pushed to ACR
#   - Azure OpenAI deployment (gpt-4.1) provisioned
#   - Environment variables configured (see env section below)
#
# Schema Notes:
#   - No canonical JSON schema exists for agent.yaml in azd extension
#   - Format follows Azure AI Foundry hosted agent patterns
#   - Compatible with both azd workflows and direct SDK deployment
# =============================================================================

# ---------------------------------------------------------------------------
# Agent metadata
# ---------------------------------------------------------------------------
name: agentic-ops-advisor
description: >
  Governed AI agent that performs root-cause and change-context reasoning over
  infrastructure telemetry and operator intent. Combines deep telemetry analysis
  with organisational change context to drive self-driving operations.
  All data is synthetic — for demo purposes only.
version: "1.0.0"

# ---------------------------------------------------------------------------
# Model configuration
# ---------------------------------------------------------------------------
model:
  # Azure OpenAI deployment name for the backing LLM
  deployment: gpt-4.1
  api_version: "2025-01-01-preview"

# ---------------------------------------------------------------------------
# Protocol version for hosted agent
# ---------------------------------------------------------------------------
protocol:
  type: responses
  version: v1

# ---------------------------------------------------------------------------
# System prompt
# ---------------------------------------------------------------------------
# The system prompt is loaded from a file to keep this manifest readable.
# It defines the agent persona, response format, confidence levels, and
# tool-usage instructions.
instructions_file: agent/system_prompt.md

# ---------------------------------------------------------------------------
# Tool definitions
# ---------------------------------------------------------------------------
# Tools are auto-registered by Agent Framework from function type annotations
# in tools/sql_telemetry.py, tools/work_context_stub.py, and tools/action_stub.py.

# ---------------------------------------------------------------------------
# Container configuration
# ---------------------------------------------------------------------------
# The agent runs as a containerised application.  The image is built from the
# project Dockerfile and pushed to Azure Container Registry (ACR).
container:
  # ACR image reference — uses variable substitution for CI/CD flexibility.
  image: ${ACR_LOGIN_SERVER}/agentic-ops-advisor:${CONTAINER_IMAGE_TAG}

  # Port the container exposes for the hosted agent HTTP server.
  port: 8088

  # Health check endpoint used by the platform to verify container readiness.
  health:
    path: /health
    interval_seconds: 30
    timeout_seconds: 5
    failure_threshold: 3

  # Resource requests for the container runtime.
  resources:
    requests:
      cpu: "1.0"
      memory: "2Gi"
    limits:
      cpu: "2.0"
      memory: "4Gi"

  # Environment variables injected into the container at runtime.
  # Secrets should be supplied via Azure Key Vault references or platform
  # secret injection — never hard-code credentials here.
  environment:
    # --- Database -----------------------------------------------------------
    - name: DB_MODE
      value: sqlite
    - name: DB_CONNECTION_STRING
      secret: true                       # Injected from platform secrets
    - name: SQLITE_DB_PATH
      value: /app/data/telemetry.db

    # --- Azure AI / OpenAI --------------------------------------------------
    - name: AZURE_AI_PROJECT_CONNECTION_STRING
      secret: true                       # Injected from platform secrets
    - name: AZURE_OPENAI_ENDPOINT
      secret: true                       # Injected from platform secrets
    - name: AZURE_OPENAI_DEPLOYMENT
      value: gpt-4.1
    - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
      value: gpt-4.1
    - name: AZURE_OPENAI_API_VERSION
      value: "2025-01-01-preview"

    # --- Feature flags ------------------------------------------------------
    - name: ENABLE_WORK_IQ
      value: "true"
    - name: ENABLE_MCP
      value: "false"

    # --- Observability ------------------------------------------------------
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      secret: true                       # Injected from platform secrets
    - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
      value: "false"                     # Keep content recording OFF by default

    # --- Azure deployment metadata ------------------------------------------
    - name: AZURE_SUBSCRIPTION_ID
      value: <your-subscription-id>
    - name: AZURE_RESOURCE_GROUP
      value: rg-agentic-ops-advisor
    - name: AZURE_LOCATION
      value: eastus
