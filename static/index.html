<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Ops Advisor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --user-msg-bg: #1f6feb;
            --assistant-msg-bg: #21262d;
            --chip-bg: #21262d;
            --chip-hover: #30363d;
            --spinner-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .disclaimer {
            font-size: 0.875rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1.5rem;
            gap: 1rem;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.5rem;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 0.875rem 1.125rem;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--assistant-msg-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        #chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .chip {
            background: var(--chip-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: var(--chip-hover);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #input-area {
            display: flex;
            gap: 0.75rem;
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        #user-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 2.5rem;
            max-height: 150px;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        #send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--border);
            border-top-color: var(--spinner-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .message-content {
                max-width: 85%;
            }

            #chips {
                flex-direction: column;
            }

            .chip {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Agentic Ops Advisor</h1>
        <div class="disclaimer">
            ⚠️ All data is synthetic — for demo purposes only
        </div>
    </header>

    <main>
        <div id="messages"></div>

        <div id="chips">
            <div class="chip" data-query="Why did GPU utilization drop in the last 24h?">
                💻 Why did GPU utilization drop in the last 24h?
            </div>
            <div class="chip" data-query="What changed right before the latency spike?">
                📡 What changed right before the latency spike?
            </div>
            <div class="chip" data-query="Is this a known issue or a change-caused incident?">
                🔍 Is this a known issue or a change-caused incident?
            </div>
            <div class="chip" data-query="What's the safest remediation plan?">
                🛠️ What's the safest remediation plan?
            </div>
        </div>

        <div id="input-area">
            <textarea 
                id="user-input" 
                placeholder="Ask about infrastructure telemetry, incidents, or changes…"
                rows="1"
            ></textarea>
            <button id="send-btn">Send</button>
        </div>
    </main>

    <script>
        let conversationHistory = [];
        let isProcessing = false;

        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chips = document.querySelectorAll('.chip');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                const query = chip.getAttribute('data-query');
                userInput.value = query;
                sendMessage();
            });
        });

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addLoadingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loading-indicator';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading-message';
            contentDiv.innerHTML = '<span class="spinner"></span><span>Analyzing telemetry…</span>';
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isProcessing) return;

            addMessage('user', message);
            
            conversationHistory.push({
                role: 'user',
                content: message
            });

            userInput.value = '';
            userInput.style.height = 'auto';

            isProcessing = true;
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing…';
            addLoadingIndicator();

            try {
                const response = await fetch('/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        input: {
                            messages: conversationHistory
                        },
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                let assistantMessage = '';
                if (data.output && data.output.length > 0) {
                    assistantMessage = data.output[0].content || '(no response)';
                } else if (data.error) {
                    assistantMessage = `Error: ${data.error}`;
                } else {
                    assistantMessage = '(empty response)';
                }

                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                removeLoadingIndicator();
                addMessage('assistant', assistantMessage);

            } catch (error) {
                removeLoadingIndicator();
                addMessage('assistant', `❌ Request failed: ${error.message}`);
                console.error('Request error:', error);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                userInput.focus();
            }
        }

        window.addEventListener('load', () => {
            userInput.focus();
        });
    </script>
</body>
</html>
